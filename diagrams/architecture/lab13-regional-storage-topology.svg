<rect width="1500" height="700" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="600" fill="#243A5E">Lab 13 - regional storage topology</text>
<text x="40" y="70" font-size="13" fill="#605E5C">Lab 13 | Matches terraform/lab13-regional-storage exactly | independent storage account, not a replica of Lab 5's</text>
<line x1="40" y1="84" x2="1460" y2="84" stroke="#E1E5EA"/>
<rect x="40" y="100" width="660" height="260" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">EASTUS2 (LAB 5, EXISTING)</text><g><rect x="70" y="140" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="100" cy="158.0" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M87,158.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="128" y="170" font-size="13" font-weight="600" fill="#243A5E">stfslogixlabeus201</text><text x="128" y="186" font-size="11" fill="#605E5C">Premium FileStorage, ZRS</text></g><g><rect x="70" y="200" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="100" cy="218.0" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M87,218.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="128" y="230" font-size="13" font-weight="600" fill="#243A5E">pe-stfslogix-lab-eus2-01</text><text x="128" y="246" font-size="11" fill="#605E5C">private endpoint</text></g><g><rect x="70" y="260" width="600" height="55" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><circle cx="100" cy="279.5" r="4" fill="none" stroke="#605E5C" stroke-width="2"/><circle cx="90" cy="295.5" r="4" fill="none" stroke="#605E5C" stroke-width="2"/><circle cx="110" cy="295.5" r="4" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M100,283.5 L90,291.5 M100,283.5 L110,291.5" stroke="#605E5C" stroke-width="1.7"/><text x="128" y="290" font-size="13" font-weight="600" fill="#243A5E">privatelink.file.core.windows.net</text><text x="128" y="306" font-size="11" fill="#605E5C">zone scoped to eastus2 storage RG only</text></g><rect x="780" y="100" width="660" height="260" rx="8" fill="#F3FAF3" stroke="#107C10" stroke-width="1.8" /><text x="794" y="122" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">CENTRALUS (LAB 13, NEW)</text><g><rect x="810" y="140" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="840" cy="158.0" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M827,158.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="868" y="170" font-size="13" font-weight="600" fill="#243A5E">stfslogixlabcus01</text><text x="868" y="186" font-size="11" fill="#605E5C">Premium FileStorage, ZRS</text></g><g><rect x="810" y="200" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="840" cy="218.0" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M827,218.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="868" y="230" font-size="13" font-weight="600" fill="#243A5E">pe-stfslogix-lab-cus-01</text><text x="868" y="246" font-size="11" fill="#605E5C">private endpoint</text></g><g><rect x="810" y="260" width="600" height="55" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><circle cx="840" cy="279.5" r="4" fill="none" stroke="#605E5C" stroke-width="2"/><circle cx="830" cy="295.5" r="4" fill="none" stroke="#605E5C" stroke-width="2"/><circle cx="850" cy="295.5" r="4" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M840,283.5 L830,291.5 M840,283.5 L850,291.5" stroke="#605E5C" stroke-width="1.7"/><text x="868" y="290" font-size="13" font-weight="600" fill="#243A5E">privatelink.file.core.windows.net</text><text x="868" y="306" font-size="11" fill="#605E5C">separate zone, scoped to centralus storage RG only</text></g><rect x="40" y="400" width="1400" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="422" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="440" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="461" font-size="11" fill="#243A5E">1  Two independent storage accounts, not a replica pair - each has its own private endpoint and its own DNS zone</text><rect x="60" y="480" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="501" font-size="11" fill="#243A5E">2  Zone names are identical (privatelink.file.core.windows.net) but the zones themselves are separate Azure resources, one per region</text><rect x="60" y="520" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="541" font-size="11" fill="#243A5E">3  A centralus session host resolves stfslogixlabcus01 through the centralus zone only - it has no DNS path to the eastus2 zone</text><rect x="60" y="560" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="581" font-size="11" fill="#B77300">4  Cross-region profile replication is NOT DNS-based - Lab 15 configures FSLogix Cloud Cache to replicate data between the two accounts directly</text><rect x="60" y="600" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="621" font-size="11" fill="#243A5E">5  Share-level RBAC (Storage File Data SMB Share Contributor) granted to the same Entra group as Lab 5, since Lab 15's replicated profiles need consistent access in both regions</text><text x="40" y="680" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against terraform/lab13-regional-storage, August 2026. Self-contained shapes, no remote icon dependency.</text></svg>
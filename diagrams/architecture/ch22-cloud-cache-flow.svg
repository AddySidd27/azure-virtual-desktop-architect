<text x="40" y="46" font-size="22" font-weight="600" fill="#243A5E">Cloud Cache read and write paths</text>
<text x="40" y="70" font-size="13" fill="#605E5C">Chapter 22 | Related: Chapter 20 | The local cache is always the fast path. Providers behind it can be swapped without the user noticing</text>
<line x1="40" y1="84" x2="1460" y2="84" stroke="#E1E5EA"/>
<rect x="40" y="100" width="460" height="180" rx="8" fill="#F5F9FD" stroke="#0078D4" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">CUSTOMER AZURE - SESSION HOST</text><g><rect x="60" y="150" width="420" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="77" y="165.0" width="26" height="18" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="84" y="183.0" width="12" height="3" fill="#243A5E"/><text x="118" y="186" font-size="13" font-weight="600" fill="#243A5E">Session Host</text></g><g><rect x="60" y="215" width="420" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="90" cy="233.0" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M77,233.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="118" y="245" font-size="13" font-weight="600" fill="#243A5E">Local Cache</text><text x="118" y="261" font-size="11" fill="#605E5C">VHDX on local disk</text></g><rect x="560" y="100" width="460" height="180" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="574" y="122" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">STORAGE PROVIDERS</text><g><rect x="580" y="150" width="420" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="610" cy="168.0" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M597,168.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="638" y="180" font-size="13" font-weight="600" fill="#243A5E">Azure Files</text><text x="638" y="196" font-size="11" fill="#605E5C">primary provider</text></g><g><rect x="580" y="215" width="420" height="50" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><ellipse cx="610" cy="233.0" rx="13" ry="4.5" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M597,233.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#605E5C" stroke-width="2"/><text x="638" y="245" font-size="13" font-weight="600" fill="#243A5E">Azure NetApp Files</text><text x="638" y="261" font-size="11" fill="#605E5C">standby provider</text></g><rect x="40" y="300" width="980" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="322" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="340" width="940" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="361" font-size="11" fill="#243A5E">1  Session Host -> Local Cache, read and write (always the fast path)</text><rect x="60" y="380" width="940" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="401" font-size="11" fill="#243A5E">2  Local Cache -> Azure Files, read (primary provider)</text><rect x="60" y="420" width="940" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="441" font-size="11" fill="#243A5E">3  Local Cache -> Azure Files, write (primary provider)</text><rect x="60" y="460" width="940" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="481" font-size="11" fill="#243A5E">4  Local Cache -> Azure NetApp Files, write (standby provider, kept in sync)</text><rect x="60" y="500" width="940" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="521" font-size="11" fill="#B77300">5  Azure NetApp Files -> Local Cache, read after failover (if primary provider is unavailable)</text><text x="40" y="580" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Self-contained shapes, no remote icon dependency.</text></svg>
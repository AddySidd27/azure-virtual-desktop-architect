<rect width="1500" height="1040" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="600" fill="#243A5E">End-to-end AVD connection and authentication flow</text>
<text x="40" y="70" font-size="13" fill="#605E5C">Hero diagram 2 | Related: Chapters 4, 8, 9, 19 | Steps run in order, top to bottom</text>
<line x1="40" y1="84" x2="1460" y2="84" stroke="#E1E5EA"/>
<circle cx="260" cy="144.0" r="18" fill="#605E5C"/><text x="260" y="150.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="300" y="110" width="900" height="68" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><text x="320" y="140" font-size="13.5" font-weight="600" fill="#243A5E">Windows App launches the connection</text><text x="320" y="160" font-size="11" fill="#605E5C">User endpoint</text><path d="M260,178 L260,205" stroke="#243A5E" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="260" cy="242.0" r="18" fill="#0078D4"/><text x="260" y="248.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="300" y="208" width="900" height="68" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><text x="320" y="238" font-size="13.5" font-weight="600" fill="#243A5E">Entra ID evaluates Conditional Access on the Azure Virtual Desktop app</text><text x="320" y="258" font-size="11" fill="#605E5C">Microsoft Entra ID</text><path d="M260,276 L260,303" stroke="#243A5E" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="260" cy="340.0" r="18" fill="#0078D4"/><text x="260" y="346.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="300" y="306" width="900" height="68" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><text x="320" y="336" font-size="13.5" font-weight="600" fill="#243A5E">Feed authorization: which application groups is this user assigned to</text><text x="320" y="356" font-size="11" fill="#605E5C">Microsoft Entra ID</text><path d="M260,374 L260,401" stroke="#243A5E" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="260" cy="438.0" r="18" fill="#0078D4"/><text x="260" y="444.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="300" y="404" width="900" height="68" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><text x="320" y="434" font-size="13.5" font-weight="600" fill="#243A5E">Broker selects a session host in the target host pool</text><text x="320" y="454" font-size="11" fill="#605E5C">Microsoft managed - AVD</text><path d="M260,472 L260,499" stroke="#243A5E" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="260" cy="536.0" r="18" fill="#0078D4"/><text x="260" y="542.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="300" y="502" width="900" height="68" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><text x="320" y="532" font-size="13.5" font-weight="600" fill="#243A5E">Gateway establishes reverse connect. No inbound RDP from the internet</text><text x="320" y="552" font-size="11" fill="#605E5C">Microsoft managed - AVD</text><path d="M260,570 L260,597" stroke="#243A5E" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="260" cy="634.0" r="18" fill="#0078D4"/><text x="260" y="640.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><rect x="300" y="600" width="900" height="68" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><text x="320" y="630" font-size="13.5" font-weight="600" fill="#243A5E">Entra ID evaluates Conditional Access again, this time on Windows Cloud Login</text><text x="320" y="650" font-size="11" fill="#605E5C">Microsoft Entra ID</text><path d="M260,668 L260,695" stroke="#243A5E" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="260" cy="732.0" r="18" fill="#243A5E"/><text x="260" y="738.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><rect x="300" y="698" width="900" height="68" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="320" y="728" font-size="13.5" font-weight="600" fill="#243A5E">Session host validates the sign-in token and the user's Virtual Machine User Login role</text><text x="320" y="748" font-size="11" fill="#605E5C">Customer Azure - session host</text><path d="M260,766 L260,793" stroke="#243A5E" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="260" cy="830.0" r="18" fill="#243A5E"/><text x="260" y="836.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><rect x="300" y="796" width="900" height="68" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="320" y="826" font-size="13.5" font-weight="600" fill="#243A5E">RDP transport negotiates Shortpath, falling back to reverse connect over TCP</text><text x="320" y="846" font-size="11" fill="#605E5C">Customer Azure - session host</text><path d="M260,864 L260,891" stroke="#243A5E" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="260" cy="928.0" r="18" fill="#243A5E"/><text x="260" y="934.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><rect x="300" y="894" width="900" height="68" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="320" y="924" font-size="13.5" font-weight="600" fill="#243A5E">FSLogix agent mounts the user's profile container over SMB 445</text><text x="320" y="944" font-size="11" fill="#605E5C">Customer Azure - session host</text><rect x="1250" y="110" width="220" height="150" rx="8" fill="#FFFFFF" stroke="#605E5C" stroke-width="1.8" /><text x="1264" y="132" font-size="12.5" font-weight="700" fill="#605E5C" letter-spacing="0.5">LEGEND</text><circle cx="1280" cy="150" r="14" fill="#605E5C"/><text x="1280" y="155" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">N</text><text x="1305" y="155" font-size="11" fill="#605E5C">User endpoint</text><circle cx="1280" cy="185" r="14" fill="#0078D4"/><text x="1280" y="190" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">N</text><text x="1305" y="190" font-size="11" fill="#605E5C">Microsoft managed / Entra</text><circle cx="1280" cy="220" r="14" fill="#243A5E"/><text x="1280" y="225" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">N</text><text x="1305" y="225" font-size="11" fill="#605E5C">Customer Azure</text><text x="60" y="1012" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Step colour indicates ownership, per the legend above.</text></svg>
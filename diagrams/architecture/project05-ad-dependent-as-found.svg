D, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="460" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="481" font-size="11" fill="#243A5E">1  Domain Controllers -> Entra Connect, sync</text><rect x="60" y="500" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="521" font-size="11" fill="#243A5E">2  Session Hosts -> Domain Controllers, domain join and GPO (hybrid join dependency)</text><rect x="60" y="540" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="561" font-size="11" fill="#243A5E">3  Session Hosts -> Scheduling SQL Server, Kerberos (on-premises dependency)</text><rect x="60" y="580" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="601" font-size="11" fill="#243A5E">4  Session Hosts -> Departmental File Shares, SMB (on-premises dependency)</text><rect x="60" y="620" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="641" font-size="11" fill="#243A5E">5  Session Hosts -> Print Server and Certificate Authority (further on-premises dependencies)</text><rect x="60" y="660" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="681" font-size="11" fill="#B77300">6  Session Hosts -> FSLogix Storage, Entra Kerberos (this one path is already cloud-native - the inconsistency)</text><rect x="60" y="700" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="721" font-size="11" fill="#243A5E">7  Microsoft Intune -> Session Hosts (co-managed alongside on-premises GPO)</text><text x="40" y="780" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against scenarios/project-05-entra-only-cloud-native.md. Self-contained shapes, no remote icon dependency.</text></svg>
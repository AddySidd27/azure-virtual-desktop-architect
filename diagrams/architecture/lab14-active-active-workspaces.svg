<rect width="1500" height="720" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="600" fill="#243A5E">Lab 14 - active-active host pools and workspaces</text>
<text x="40" y="70" font-size="13" fill="#605E5C">Lab 14 | Matches terraform/lab14-active-active-hostpools exactly | standard host-pool management, not Session Host Configuration</text>
<line x1="40" y1="84" x2="1460" y2="84" stroke="#E1E5EA"/>
<rect x="40" y="100" width="660" height="260" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">EASTUS2 (LAB 7-8, EXISTING)</text><g><rect x="70" y="140" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="85" y="154.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="102" y="154.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="93" y="167.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><text x="128" y="170" font-size="13" font-weight="600" fill="#243A5E">hp-avd-lab-eus2-01</text><text x="128" y="186" font-size="11" fill="#605E5C">Pooled, standard management</text></g><g><rect x="70" y="200" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="100" cy="225.0" r="12" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M95,225.0 l4,4 l7,-8" fill="none" stroke="#243A5E" stroke-width="2"/><text x="128" y="230" font-size="13" font-weight="600" fill="#243A5E">ws-avdlab-lab-eus2-01</text><text x="128" y="246" font-size="11" fill="#605E5C">East US 2 Desktop workspace</text></g><g><rect x="70" y="260" width="600" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="87" y="277.5" width="26" height="18" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="94" y="295.5" width="12" height="3" fill="#243A5E"/><text x="128" y="290" font-size="13" font-weight="600" fill="#243A5E">2x session hosts</text><text x="128" y="306" font-size="11" fill="#605E5C">AVD agent + bootloader extensions</text></g><rect x="780" y="100" width="660" height="260" rx="8" fill="#F3FAF3" stroke="#107C10" stroke-width="1.8" /><text x="794" y="122" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">CENTRALUS (LAB 14, NEW)</text><g><rect x="810" y="140" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="825" y="154.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="842" y="154.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="833" y="167.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><text x="868" y="170" font-size="13" font-weight="600" fill="#243A5E">hp-avd-lab-cus-01</text><text x="868" y="186" font-size="11" fill="#605E5C">Pooled, standard management</text></g><g><rect x="810" y="200" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="840" cy="225.0" r="12" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M835,225.0 l4,4 l7,-8" fill="none" stroke="#243A5E" stroke-width="2"/><text x="868" y="230" font-size="13" font-weight="600" fill="#243A5E">ws-avdlab-lab-cus-01</text><text x="868" y="246" font-size="11" fill="#605E5C">Central US Desktop workspace</text></g><g><rect x="810" y="260" width="600" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="827" y="277.5" width="26" height="18" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="834" y="295.5" width="12" height="3" fill="#243A5E"/><text x="868" y="290" font-size="13" font-weight="600" fill="#243A5E">2x session hosts</text><text x="868" y="306" font-size="11" fill="#605E5C">AVD agent + bootloader extensions</text></g><rect x="40" y="420" width="1400" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="442" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS AND DESIGN NOTES (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="460" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="481" font-size="11" fill="#243A5E">1  Both host pools are fully independent - not one pool spanning two regions - each with its own workspace and application group</text><rect x="60" y="500" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="521" font-size="11" fill="#B77300">2  A user assigned to BOTH regions' application groups sees TWO desktop entries in Windows App - this is expected active-active behaviour, not a bug</text><rect x="60" y="540" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="561" font-size="11" fill="#243A5E">3  Lab 16 prevents that duplicate assignment: each user is assigned to exactly one region's application group at a time</text><rect x="60" y="580" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="601" font-size="11" fill="#243A5E">4  Neither host pool uses Session Host Configuration - both use standard management, matching Lab 7/8 exactly (see the ADR)</text><rect x="60" y="620" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="641" font-size="11" fill="#243A5E">5  Both regions serve real, separate user cohorts simultaneously - this is active-active, not one region on standby for the other (that is Lab 19)</text><text x="40" y="700" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against terraform/lab14-active-active-hostpools, August 2026. Self-contained shapes, no remote icon dependency.</text></svg>
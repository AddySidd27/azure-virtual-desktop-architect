<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="805" viewBox="0 0 1500 805" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="arrow-243A5E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#243A5E"/></marker><marker id="arrow-107C10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#107C10"/></marker><marker id="arrow-B77300" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B77300"/></marker><marker id="arrow-605E5C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#605E5C"/></marker><marker id="arrow-0078D4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7FAFD"/></linearGradient></defs>
<rect width="1500" height="805" fill="#FFFFFF"/>
<text x="40" y="42" font-size="21" font-weight="600" fill="#243A5E">Northwind AVD Landing Zone: architecture at a glance</text>
<text x="40" y="66" font-size="12.5" fill="#605E5C">Capstone Part E | The first part to build AVD-specific infrastructure - everything before this was platform, consumed not owned</text>
<line x1="40" y1="78" x2="1460" y2="78" stroke="#E1E5EA"/>
<rect x="500" y="100" width="500" height="50" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="516" y="126" font-size="13" font-weight="600" fill="#107C10">Landing Zones / Corp (Part B, reserved empty)</text><text x="516" y="144" font-size="11" fill="#605E5C">Now populated with two AVD subscriptions - policy inheritance from Part B applies automatically</text><path d="M620,150 L620,180 L280,180 L280,210" stroke="#107C10" stroke-width="2" fill="none"/><path d="M880,150 L880,180 L1180,180 L1180,210" stroke="#107C10" stroke-width="2" fill="none"/><rect x="60" y="210" width="660" height="300" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8"/><text x="74" y="232" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">sub-northwind-avd-prod - East US 2 spoke</text><rect x="90" y="250" width="600" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="106" y="276" font-size="13" font-weight="600" fill="#243A5E">AVD spoke VNet, peered to platform hub</text><text x="106" y="294" font-size="11" fill="#605E5C">Uses East US 2 hub's ExpressRoute + Firewall - owns nothing platform-level</text><rect x="90" y="315" width="600" height="55" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="106" y="341" font-size="13" font-weight="600" fill="#107C10">Host pool naming policy (custom)</text><text x="106" y="359" font-size="11" fill="#605E5C">hp-&lt;persona&gt;-&lt;env&gt;-&lt;region&gt;-&lt;instance&gt; enforced at subscription level</text><rect x="90" y="380" width="600" height="90" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="106" y="406" font-size="13" font-weight="600" fill="#107C10">AVD-specific RBAC</text><text x="106" y="424" font-size="11" fill="#605E5C">Platform Engineer + Session Host Operator: PIM-eligible</text><text x="106" y="440" font-size="11" fill="#605E5C">Service Desk: STANDING, deliberately - see section 7</text><rect x="780" y="210" width="660" height="300" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8"/><text x="794" y="232" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">sub-northwind-avd-prod - West Europe spoke</text><rect x="810" y="250" width="600" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="826" y="276" font-size="13" font-weight="600" fill="#243A5E">AVD spoke VNet, peered to platform hub</text><text x="826" y="294" font-size="11" fill="#605E5C">Uses West Europe hub's ExpressRoute + Firewall</text><rect x="810" y="315" width="600" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="826" y="341" font-size="13" font-weight="600" fill="#243A5E">Serves Amsterdam directly</text><text x="826" y="359" font-size="11" fill="#605E5C">Via ExpressRoute, same as East US 2 serves Chicago</text><rect x="810" y="380" width="600" height="90" rx="6" fill="#FDF6EC" stroke="#B77300" stroke-width="1.6" stroke-dasharray="6,4"/><text x="826" y="406" font-size="13" font-weight="600" fill="#B77300">Bangalore's decision, made here</text><text x="826" y="424" font-size="11" fill="#605E5C">Internet path + Conditional Access (compliant device + MFA)</text><text x="826" y="440" font-size="11" fill="#605E5C">No new region, no new hub - a workload decision, not a platform one</text><rect x="40" y="550" width="1420" height="215" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8"/><text x="54" y="572" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">HOW TO READ THIS IN 60 SECONDS</text><rect x="60" y="590" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#107C10" stroke-width="1.4"/><text x="74" y="611" font-size="10.8" fill="#107C10">1  Corp was reserved, empty, since Part B - this is the part that finally populates it, and Part B's 3 tenant-wide policies now apply automatically.</text><rect x="60" y="630" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#107C10" stroke-width="1.4"/><text x="74" y="651" font-size="10.8" fill="#107C10">2  Every AVD RBAC role is built with its correct type from the start - the PIM remediation exists because Parts B/D didn't do this the first time; this part doesn't repeat that mistake.</text><rect x="60" y="670" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300" stroke-width="1.4"/><text x="74" y="691" font-size="10.8" fill="#B77300">3  Bangalore's resolution required nothing new at the platform layer - the entire decision lives inside this AVD Landing Zone's Conditional Access policy and workspace assignment.</text><rect x="60" y="710" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#605E5C" stroke-width="1.4"/><text x="74" y="731" font-size="10.8" fill="#605E5C">4  No AVD workload resource - host pools, session hosts, images - exists yet. This part builds the landing zone Part F's workload will live inside, nothing more.</text><text x="40" y="785" font-size="10.5" fill="#605E5C">Original architecture diagram for this capstone, not Microsoft's. Verified against terraform/capstone-northwind/avd-landing-zone and Part E, August 2026. Self-contained, no remote icon dependency.</text></svg>
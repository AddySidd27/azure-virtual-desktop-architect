-eus2-01: Allow-Domain-Services-From-Hosts  (inbound, AD DS ports, from snet-hosts only)</text><text x="40" y="600" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against terraform/lab03-network, August 2026. Self-contained shapes, no remote icon dependency.</text></svg>
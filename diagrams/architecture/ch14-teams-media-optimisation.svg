0 h10 M545,220.0 h10 M545,225.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="578" y="236" font-size="13" font-weight="600" fill="#243A5E">WebRTC Redirector</text></g><rect x="860" y="100" width="260" height="150" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="874" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">MICROSOFT 365</text><g><rect x="880" y="150" width="220" height="60" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><circle cx="910" cy="180.0" r="12" fill="none" stroke="#0078D4" stroke-width="2"/><path d="M905,180.0 l4,4 l7,-8" fill="none" stroke="#0078D4" stroke-width="2"/><text x="938" y="186" font-size="13" font-weight="600" fill="#243A5E">Teams Service</text></g><rect x="40" y="300" width="1080" height="335" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="322" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="340" width="1040" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="361" font-size="11" fill="#243A5E">1  Teams Client (session host) -> WebRTC Redirector, signalling</text><rect x="60" y="380" width="1040" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="401" font-size="11" fill="#243A5E">2  WebRTC Redirector -> Windows App, redirect instruction</text><rect x="60" y="420" width="1040" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="441" font-size="11" fill="#243A5E">3  Windows App -> Media Engine (local, on the endpoint)</text><rect x="60" y="460" width="1040" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="481" font-size="11" fill="#243A5E">4  Media Engine -> Camera and Audio (local device access)</text><rect x="60" y="500" width="1040" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="521" font-size="11" fill="#243A5E">5  Media Engine -> Teams Service, optimised media (direct from endpoint)</text><rect x="60" y="540" width="1040" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="561" font-size="11" fill="#243A5E">6  Teams Client -> Teams Service, chat and presence (always via session host)</text><rect x="60" y="580" width="1040" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="601" font-size="11" fill="#243A5E">7  Teams Client -> Teams Service, fallback media (if optimisation fails)</text><rect x="40" y="665" width="340" height="68" rx="6" fill="#FFFFFF" stroke="#D8DDE3"/><text x="52" y="685" font-size="12" font-weight="700" fill="#243A5E">Legend</text><path d="M52,701 L92,701" stroke="#107C10" stroke-width="2.4" /><text x="102" y="705" font-size="11" fill="#605E5C">Optimised media, direct from endpoint (flow 5)</text><path d="M52,721 L92,721" stroke="#A4262C" stroke-width="2.4" stroke-dasharray="7 5"/><text x="102" y="725" font-size="11" fill="#605E5C">Fallback: media processed via session host (flow 7)</text><text x="40" y="755" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Self-contained shapes, no remote icon dependency.</text></svg>
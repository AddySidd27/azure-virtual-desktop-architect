"225" width="300" height="60" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="1170" cy="247.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="1160" cy="263.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="1180" cy="263.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M1170,251.0 L1160,259.0 M1170,251.0 L1180,259.0" stroke="#243A5E" stroke-width="1.7"/><text x="1198" y="255" font-size="13" font-weight="600" fill="#243A5E">snet-hosts-lab-eus2-01</text><text x="1198" y="271" font-size="11" fill="#605E5C">Lab 3 subnet</text></g><rect x="40" y="340" width="1420" height="295" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="362" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="380" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="401" font-size="11" fill="#243A5E">1  Terraform creates nic-avdlab-h1 in snet-hosts-lab-eus2-01, then vm-avdlab-h1</text><rect x="60" y="420" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="441" font-size="11" fill="#243A5E">2  domainJoin extension runs: vm-avdlab-h1 joins avdlab.local, using vm-avdlab-dc01 as DNS</text><rect x="60" y="460" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="481" font-size="11" fill="#243A5E">3  avdAgentRegistration extension runs after domainJoin completes (depends_on enforces this order)</text><rect x="60" y="500" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="521" font-size="11" fill="#243A5E">4  avdAgentRegistration registers vm-avdlab-h1 into hp-avd-lab-eus2-01 using the Lab 7 registration token</text><rect x="60" y="540" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="561" font-size="11" fill="#B77300">5  Manual step (Lab 8 Step 4): FSLogix registry configuration from Lab 6 applied via az vm run-command</text><rect x="60" y="580" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="601" font-size="11" fill="#243A5E">6  vm-avdlab-h1 -> stfslogixlabeus201, SMB 445 (profile mount at first sign-in)</text><text x="40" y="660" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against terraform/lab08-session-hosts, August 2026. Self-contained shapes, no remote icon dependency.</text></svg>
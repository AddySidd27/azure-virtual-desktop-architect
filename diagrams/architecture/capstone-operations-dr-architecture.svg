<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1130" viewBox="0 0 1500 1130" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7FAFD"/></linearGradient></defs>
<rect width="1500" height="1130" fill="#FFFFFF"/>
<text x="40" y="42" font-size="21" font-weight="600" fill="#243A5E">Northwind Operations and DR: what exists versus what is designed only</text>
<text x="40" y="66" font-size="12.5" fill="#605E5C">Capstone Part H | Solid = Terraform implemented | Dashed amber = architecturally designed, not built</text>
<line x1="40" y1="78" x2="1460" y2="78" stroke="#E1E5EA"/>
<rect x="60" y="100" width="1380" height="200" rx="8" fill="#F3FAF3" stroke="#107C10" stroke-width="1.8"/><text x="74" y="122" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">BUILT IN THIS PART - TERRAFORM IMPLEMENTED</text><rect x="90" y="140" width="320" height="60" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="102" y="160" font-size="12" font-weight="600" fill="#107C10">Regional AVD monitoring</text><text x="102" y="175" font-size="9.5" fill="#605E5C">2 workspaces + host pool diagnostics (H1)</text><rect x="430" y="140" width="320" height="60" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="442" y="160" font-size="12" font-weight="600" fill="#107C10">6 autoscaling plans</text><text x="442" y="175" font-size="9.5" fill="#605E5C">Task/know/fin x 2 regions, wider W.Europe window (H4)</text><rect x="770" y="140" width="320" height="60" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="782" y="160" font-size="12" font-weight="600" fill="#107C10">FSLogix Azure Backup</text><text x="782" y="175" font-size="9.5" fill="#605E5C">Real backup, distinct from Cloud Cache (H3)</text><rect x="1110" y="140" width="320" height="60" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="1122" y="160" font-size="12" font-weight="600" fill="#107C10">FinOps, 5 subscriptions</text><text x="1122" y="175" font-size="9.5" fill="#605E5C">Extended to both AVD subs (H5)</text><rect x="90" y="215" width="1340" height="55" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="102" y="235" font-size="12" font-weight="600" fill="#107C10">Two independently active regions + cross-region FSLogix redundancy (Parts E/F, unchanged)</text><text x="102" y="250" font-size="9.5" fill="#605E5C">Real, built - but NOT disaster recovery, see below</text><rect x="60" y="330" width="1380" height="220" rx="8" fill="#FDF6EC" stroke="#B77300" stroke-width="1.8"/><text x="74" y="352" font-size="12.5" font-weight="700" fill="#B77300" letter-spacing="0.5">DESIGNED ONLY - NO TERRAFORM EXISTS ANYWHERE (the central Part H finding)</text><rect x="90" y="370" width="660" height="150" rx="6" fill="#FDF6EC" stroke="#B77300" stroke-width="1.6" stroke-dasharray="6,4"/><text x="102" y="390" font-size="12" font-weight="600" fill="#B77300">Active-passive cross-region failover</text><text x="102" y="405" font-size="10" fill="#605E5C">For ANY of the five personas, in EITHER direction:</text><text x="102" y="418" font-size="10" fill="#605E5C">no warm-standby host pool, no reserved capacity,</text><text x="102" y="431" font-size="10" fill="#605E5C">no workspace reassignment, no rehearsed runbook.</text><text x="102" y="444" font-size="10" fill="#605E5C">Lab 19's proven pattern exists - not applied here yet.</text><rect x="770" y="370" width="660" height="150" rx="6" fill="#FDF6EC" stroke="#B77300" stroke-width="1.6" stroke-dasharray="6,4"/><text x="782" y="390" font-size="12" font-weight="600" fill="#B77300">Recommendation: finance-first (ADR-CAP-07)</text><text x="782" y="405" font-size="10" fill="#605E5C">Smallest pooled persona, highest compliance weight -</text><text x="782" y="418" font-size="10" fill="#605E5C">but CONDITIONAL on Northwind's business and</text><text x="782" y="431" font-size="10" fill="#605E5C">compliance approval. Not built speculatively,</text><text x="782" y="444" font-size="10" fill="#605E5C">not decided by this document alone.</text><rect x="60" y="580" width="1380" height="280" rx="8" fill="#EFF6FC" stroke="#243A5E" stroke-width="1.8"/><text x="74" y="602" font-size="12.5" font-weight="700" fill="#243A5E" letter-spacing="0.5">PER-COMPONENT RECOVERY, TIED TO AN ACTUAL MECHANISM OR EXPLICITLY TO NONE</text><rect x="90" y="620" width="380" height="36" rx="4" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.2"/><text x="100" y="643" font-size="11" fill="#243A5E">AVD control plane</text><rect x="480" y="620" width="930" height="36" rx="4" fill="#FFFFFF" stroke="#107C10" stroke-width="1.4"/><text x="492" y="643" font-size="11" fill="#107C10">N/A - Microsoft managed</text><rect x="90" y="660" width="380" height="36" rx="4" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.2"/><text x="100" y="683" font-size="11" fill="#243A5E">Session hosts, SAME region</text><rect x="480" y="660" width="930" height="36" rx="4" fill="#FFFFFF" stroke="#107C10" stroke-width="1.4"/><text x="492" y="683" font-size="11" fill="#107C10">~2hrs via terraform apply - mechanism exists</text><rect x="90" y="700" width="380" height="36" rx="4" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.2"/><text x="100" y="723" font-size="11" fill="#243A5E">Session hosts, CROSS region</text><rect x="480" y="700" width="930" height="36" rx="4" fill="#FFFFFF" stroke="#B77300" stroke-width="1.4" stroke-dasharray="6,4"/><text x="492" y="723" font-size="11" fill="#B77300">NO MECHANISM - the gap this part names</text><rect x="90" y="740" width="380" height="36" rx="4" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.2"/><text x="100" y="763" font-size="11" fill="#243A5E">Golden image replication</text><rect x="480" y="740" width="930" height="36" rx="4" fill="#FFFFFF" stroke="#B77300" stroke-width="1.4" stroke-dasharray="6,4"/><text x="492" y="763" font-size="11" fill="#B77300">Designed only, no Terraform (Part F16)</text><rect x="90" y="780" width="380" height="36" rx="4" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.2"/><text x="100" y="803" font-size="11" fill="#243A5E">FSLogix data</text><rect x="480" y="780" width="930" height="36" rx="4" fill="#FFFFFF" stroke="#107C10" stroke-width="1.4"/><text x="492" y="803" font-size="11" fill="#107C10">Azure Backup exists - restore never tested</text><rect x="90" y="820" width="380" height="36" rx="4" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.2"/><text x="100" y="843" font-size="11" fill="#243A5E">Application data (SAP etc.)</text><rect x="480" y="820" width="930" height="36" rx="4" fill="#FFFFFF" stroke="#605E5C" stroke-width="1.4"/><text x="492" y="843" font-size="11" fill="#605E5C">Out of scope, owned by those systems</text><rect x="40" y="875" width="1420" height="215" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8"/><text x="54" y="897" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">HOW TO READ THIS IN 60 SECONDS</text><rect x="60" y="915" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.4"/><text x="74" y="936" font-size="10.5" fill="#243A5E">1  Two active regions is a scale/locality decision, NOT a resilience decision - each serves its own population, neither stands ready for the other's failure.</text><rect x="60" y="955" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#107C10" stroke-width="1.4"/><text x="74" y="976" font-size="10.5" fill="#107C10">2  Cloud Cache redundancy and Azure Backup are genuinely different things, doing different jobs - this part built the backup half that was missing.</text><rect x="60" y="995" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300" stroke-width="1.4"/><text x="74" y="1016" font-size="10.5" fill="#B77300">3  If East US 2 disappeared today, Chicago's users would have no path back - their data would survive in West Europe with nothing configured to serve them.</text><rect x="60" y="1035" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300" stroke-width="1.4"/><text x="74" y="1056" font-size="10.5" fill="#B77300">4  The finance-first DR recommendation is conditional, not decided - it requires Northwind's own cost approval, exactly as Project 14's DR engagement required.</text><text x="40" y="1110" font-size="10.5" fill="#605E5C">Original architecture diagram for this capstone, not Microsoft's. Verified against terraform/capstone-northwind/avd-platform and Part H, August 2026. Self-contained, no remote icon dependency.</text></svg>
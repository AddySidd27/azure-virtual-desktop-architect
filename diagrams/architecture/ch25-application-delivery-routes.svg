<rect x="40" y="100" width="340" height="300" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">DELIVERY SOURCE - CHOOSE PER APP</text><g><rect x="60" y="140" width="300" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="90" cy="160.5" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M77,160.5 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="118" y="170" font-size="13" font-weight="600" fill="#243A5E">Golden Image</text><text x="118" y="186" font-size="11" fill="#605E5C">baked in</text></g><g><rect x="60" y="205" width="300" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="90" cy="225.5" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M77,225.5 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="118" y="235" font-size="13" font-weight="600" fill="#243A5E">App Attach Package</text><text x="118" y="251" font-size="11" fill="#605E5C">attach at sign-in</text></g><g><rect x="60" y="270" width="300" height="55" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><rect x="80" y="285.5" width="20" height="24" rx="2" fill="none" stroke="#0078D4" stroke-width="2"/><path d="M85,292.5 h10 M85,297.5 h10 M85,302.5 h6" stroke="#0078D4" stroke-width="1.7"/><text x="118" y="300" font-size="13" font-weight="600" fill="#243A5E">Microsoft Intune</text><text x="118" y="316" font-size="11" fill="#605E5C">system context</text></g><g><rect x="60" y="335" width="300" height="45" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="90" cy="357.5" r="12" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M85,357.5 l4,4 l7,-8" fill="none" stroke="#243A5E" stroke-width="2"/><text x="118" y="371" font-size="13" font-weight="600" fill="#243A5E">Locally Installed</text></g><rect x="420" y="100" width="260" height="300" rx="8" fill="#F5F9FD" stroke="#0078D4" stroke-width="1.8" /><text x="434" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">CUSTOMER AZURE</text><g><rect x="440" y="230" width="220" height="60" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="457" y="250.0" width="26" height="18" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="464" y="268.0" width="12" height="3" fill="#243A5E"/><text x="498" y="266" font-size="13" font-weight="600" fill="#243A5E">Session Host</text></g><rect x="720" y="100" width="300" height="300" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="734" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">PUBLISHING</text><g><rect x="740" y="180" width="260" height="50" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><text x="798" y="216" font-size="13" font-weight="600" fill="#243A5E">Desktop App Group</text></g><g><rect x="740" y="250" width="260" height="50" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><text x="798" y="286" font-size="13" font-weight="600" fill="#243A5E">RemoteApp App Group</text></g><rect x="1060" y="100" width="220" height="300" rx="8" fill="#FBFBFC" stroke="#605E5C" stroke-width="1.8" stroke-dasharray="7 5"/><text x="1074" y="122" font-size="12.5" font-weight="700" fill="#605E5C" letter-spacing="0.5">USER ENDPOINT</text><g><rect x="1080" y="230" width="180" height="60" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="1096" y="250.0" width="28" height="17" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M1102,271.0 h16" stroke="#243A5E" stroke-width="2"/><text x="1138" y="266" font-size="13" font-weight="600" fill="#243A5E">Windows App</text></g><rect x="40" y="430" width="1240" height="375" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="452" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="470" width="1200" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="491" font-size="11" fill="#243A5E">1  Golden Image -> Session Host, baked in (in the image, always present)</text><rect x="60" y="510" width="1200" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="531" font-size="11" fill="#243A5E">2  App Attach Package -> Session Host, attach at sign-in (per-user, no image rebuild)</text><rect x="60" y="550" width="1200" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="571" font-size="11" fill="#243A5E">3  Microsoft Intune -> Session Host, system context install (Required intent only)</text><rect x="60" y="590" width="1200" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="611" font-size="11" fill="#243A5E">4  Locally Installed -> Session Host (installed directly, outside the image pipeline)</text><rect x="60" y="630" width="1200" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="651" font-size="11" fill="#243A5E">5  Session Host -> Desktop App Group, full desktop published</text><rect x="60" y="670" width="1200" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="691" font-size="11" fill="#243A5E">6  Session Host -> RemoteApp App Group, individual apps published</text><rect x="60" y="710" width="1200" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="731" font-size="11" fill="#243A5E">7  Desktop App Group -> Windows App, full desktop delivered</text><rect x="60" y="750" width="1200" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="771" font-size="11" fill="#243A5E">8  RemoteApp App Group -> Windows App, individual apps delivered</text><text x="40" y="830" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Self-contained shapes, no remote icon dependency.</text></svg>
<rect x="40" y="100" width="260" height="170" rx="8" fill="#FBFBFC" stroke="#605E5C" stroke-width="1.8" stroke-dasharray="7 5"/><text x="54" y="122" font-size="12.5" font-weight="700" fill="#605E5C" letter-spacing="0.5">OPERATOR</text><g><rect x="60" y="150" width="220" height="70" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="76" y="175.0" width="28" height="17" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M82,196.0 h16" stroke="#243A5E" stroke-width="2"/><text x="118" y="180" font-size="13" font-weight="600" fill="#243A5E">az vm run-command</text><text x="118" y="196" font-size="11" fill="#605E5C">no RDP needed</text></g><rect x="340" y="100" width="300" height="170" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="354" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">MICROSOFT MANAGED</text><g><rect x="360" y="155" width="260" height="60" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><circle cx="390" cy="185.0" r="12" fill="none" stroke="#0078D4" stroke-width="2"/><path d="M385,185.0 l4,4 l7,-8" fill="none" stroke="#0078D4" stroke-width="2"/><text x="418" y="191" font-size="13" font-weight="600" fill="#243A5E">Azure Resource Manager</text></g><rect x="700" y="100" width="760" height="170" rx="8" fill="#F5F9FD" stroke="#1F5B96" stroke-width="1.8" /><text x="714" y="122" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">VNET-AVD-LAB-EUS2-01, SNET-IDENTITY-LAB-EUS2-01</text><g><rect x="720" y="150" width="340" height="65" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="737" y="169.5" width="26" height="26" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="750" cy="182.5" r="6" fill="none" stroke="#243A5E" stroke-width="1.7"/><text x="778" y="180" font-size="13" font-weight="600" fill="#243A5E">vm-avdlab-dc01</text><text x="778" y="196" font-size="11" fill="#605E5C">computer name: AVDLAB-DC01</text></g><g><rect x="1080" y="150" width="340" height="65" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="1110" cy="174.5" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="1100" cy="190.5" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="1120" cy="190.5" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M1110,178.5 L1100,186.5 M1110,178.5 L1120,186.5" stroke="#243A5E" stroke-width="1.7"/><text x="1138" y="180" font-size="13" font-weight="600" fill="#243A5E">nic-avdlab-dc01</text><text x="1138" y="196" font-size="11" fill="#605E5C">static IP: 10.10.1.4</text></g><rect x="40" y="300" width="1420" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="322" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="340" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="361" font-size="11" fill="#243A5E">1  Operator -> Azure Resource Manager, az vm run-command (no interactive RDP session used)</text><rect x="60" y="380" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="401" font-size="11" fill="#243A5E">2  Azure Resource Manager -> vm-avdlab-dc01, control plane (extension execution)</text><rect x="60" y="420" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="441" font-size="11" fill="#243A5E">3  vm-avdlab-dc01 promoted to domain controller for avdlab.local, static IP 10.10.1.4</text><rect x="60" y="460" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="481" font-size="11" fill="#243A5E">4  nic-avdlab-dc01 (10.10.1.4) becomes the VNet's DNS server for snet-hosts and snet-storage (configured in Lab 3/8)</text><rect x="60" y="500" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="521" font-size="11" fill="#243A5E">5  osdisk-avdlab-dc01: OS disk, 15-character NetBIOS limit is why the computer name is AVDLAB-DC01, not vm-avdlab-dc01</text><text x="40" y="580" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against terraform/lab04-identity, August 2026. Self-contained shapes, no remote icon dependency.</text></svg>
<rect width="1500" height="760" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="600" fill="#243A5E">Lab 18 - regional monitoring topology</text>
<text x="40" y="70" font-size="13" fill="#605E5C">Lab 18 | Matches terraform/lab18-regional-security-monitoring exactly | separate workspaces, one dashboard on top</text>
<line x1="40" y1="84" x2="1460" y2="84" stroke="#E1E5EA"/>
<rect x="40" y="100" width="660" height="190" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">EASTUS2 (LAB 10, EXISTING)</text><g><rect x="70" y="140" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><path d="M87,173.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="128" y="170" font-size="13" font-weight="600" fill="#243A5E">log-avd-lab-eus2-01</text><text x="128" y="186" font-size="11" fill="#605E5C">Log Analytics workspace</text></g><g><rect x="70" y="200" width="600" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><path d="M87,235.5 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="128" y="230" font-size="13" font-weight="600" fill="#243A5E">diag-hostpool</text><text x="128" y="246" font-size="11" fill="#605E5C">Checkpoint, Error, Management, Connection, HostRegistration</text></g><rect x="780" y="100" width="660" height="190" rx="8" fill="#F3FAF3" stroke="#107C10" stroke-width="1.8" /><text x="794" y="122" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">CENTRALUS (LAB 18, NEW)</text><g><rect x="810" y="140" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><path d="M827,173.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="868" y="170" font-size="13" font-weight="600" fill="#243A5E">log-avd-lab-cus-01</text><text x="868" y="186" font-size="11" fill="#605E5C">Log Analytics workspace</text></g><g><rect x="810" y="200" width="600" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><path d="M827,235.5 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="868" y="230" font-size="13" font-weight="600" fill="#243A5E">diag-hostpool</text><text x="868" y="246" font-size="11" fill="#605E5C">Checkpoint, Error, Management, Connection, HostRegistration</text></g><rect x="300" y="330" width="900" height="100" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="314" y="352" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">AZURE WORKBOOK - CROSS-WORKSPACE KQL QUERY</text><g><rect x="330" y="365" width="840" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="360" cy="390.0" r="12" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M355,390.0 l4,4 l7,-8" fill="none" stroke="#243A5E" stroke-width="2"/><text x="388" y="395" font-size="13" font-weight="600" fill="#243A5E">One dashboard, built ON TOP of both workspaces</text><text x="388" y="411" font-size="11" fill="#605E5C">query layer aggregates, data layer stays isolated</text></g><rect x="40" y="460" width="1400" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="482" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS AND DESIGN NOTES (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="500" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="521" font-size="11" fill="#243A5E">1  Two independent Log Analytics workspaces, not one shared workspace - same reasoning as Lab 16's groups and Lab 17's scaling plans</text><rect x="60" y="540" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="561" font-size="11" fill="#243A5E">2  Each workspace receives diagnostics from its own region's host pool only, via its own diagnostic setting resource</text><rect x="60" y="580" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="601" font-size="11" fill="#243A5E">3  The dashboard queries both workspaces with cross-workspace(), aggregating for the operator's convenience without merging the underlying data</text><rect x="60" y="620" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="641" font-size="11" fill="#B77300">4  If centralus's workspace becomes unreachable, the dashboard shows a GAP for that region specifically, not a total failure</text><rect x="60" y="660" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="681" font-size="11" fill="#243A5E">5  Firewall for centralus egress control is OFF by default (var.deploy_firewall = false) - NSG-only egress matches Lab 11's pattern at a fraction of the cost</text><text x="40" y="740" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against terraform/lab18-regional-security-monitoring, August 2026. Self-contained shapes, no remote icon dependency.</text></svg>
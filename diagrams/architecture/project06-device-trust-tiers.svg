9.0" width="14" height="10" rx="1.5" fill="none" stroke="#107C10" stroke-width="2"/><rect x="93" y="352.0" width="14" height="10" rx="1.5" fill="none" stroke="#107C10" stroke-width="2"/><text x="128" y="350" font-size="13" font-weight="600" fill="#243A5E">Managed Pool</text><text x="128" y="366" font-size="11" fill="#605E5C">compliant corporate devices, full redirection allowed by exception</text></g><g><rect x="530" y="320" width="440" height="60" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><rect x="545" y="339.0" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><rect x="562" y="339.0" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><rect x="553" y="352.0" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><text x="588" y="350" font-size="13" font-weight="600" fill="#243A5E">Restricted Pool</text><text x="588" y="366" font-size="11" fill="#605E5C">unmanaged devices, narrow RDP properties, no drive redirection</text></g><g><rect x="990" y="320" width="440" height="60" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><rect x="1005" y="339.0" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><rect x="1022" y="339.0" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><rect x="1013" y="352.0" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><text x="1048" y="350" font-size="13" font-weight="600" fill="#243A5E">Client-Device Pool</text><text x="1048" y="366" font-size="11" fill="#605E5C">client-owned devices, narrowest policy</text></g><rect x="40" y="500" width="1420" height="375" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="522" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="540" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="561" font-size="11" fill="#243A5E">1  Corporate Laptop -> Conditional Access, evaluated against Device Compliance</text><rect x="60" y="580" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="601" font-size="11" fill="#243A5E">2  Contractor Device -> Conditional Access, evaluated as unmanaged</text><rect x="60" y="620" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="641" font-size="11" fill="#243A5E">3  Client Device -> Conditional Access, evaluated as client-owned</text><rect x="60" y="660" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="681" font-size="11" fill="#243A5E">4  Compliant result -> Managed Pool</text><rect x="60" y="700" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="721" font-size="11" fill="#243A5E">5  Unmanaged result -> Restricted Pool</text><rect x="60" y="740" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="761" font-size="11" fill="#243A5E">6  Client-owned result -> Client-Device Pool</text><rect x="60" y="780" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="801" font-size="11" fill="#243A5E">7  Host Pool RDP Properties gate every pool's channels (Managed Pool: broadest allow, Restricted/Client: narrow)</text><rect x="60" y="820" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="841" font-size="11" fill="#243A5E">8  Intune Policy narrows Restricted and Client-Device Pool behaviour further, beyond the RDP property gate</text><text x="40" y="900" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against scenarios/project-06-byod-remote-workforce.md. Self-contained shapes, no remote icon dependency.</text></svg>
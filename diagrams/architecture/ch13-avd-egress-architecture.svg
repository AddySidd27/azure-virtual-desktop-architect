 stroke="#243A5E" stroke-width="1.6"/><rect x="87" y="330.0" width="26" height="18" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="94" y="348.0" width="12" height="3" fill="#243A5E"/><text x="128" y="340" font-size="13" font-weight="600" fill="#243A5E">Session Hosts</text><text x="128" y="356" font-size="11" fill="#605E5C">no public IP, outbound only</text></g><g><rect x="710" y="310" width="620" height="60" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><rect x="730" y="328.0" width="20" height="24" rx="2" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M735,335.0 h10 M735,340.0 h10 M735,345.0 h6" stroke="#605E5C" stroke-width="1.7"/><text x="768" y="340" font-size="13" font-weight="600" fill="#243A5E">Route Table</text><text x="768" y="356" font-size="11" fill="#605E5C">UDR: 0.0.0.0/0 -> firewall</text></g><rect x="40" y="480" width="1320" height="215" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="502" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="520" width="630" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="541" font-size="11" fill="#243A5E">1  Windows App -> AVD Gateway, RDP (reverse connect, no inbound)</text><rect x="720" y="520" width="630" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="734" y="541" font-size="11" fill="#243A5E">2  Session Hosts -> Route Table, outbound 443</text><rect x="60" y="560" width="630" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="581" font-size="11" fill="#243A5E">3  Route Table -> Azure Firewall, 0.0.0.0/0 (annotation, not a hop)</text><rect x="720" y="560" width="630" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="734" y="581" font-size="11" fill="#243A5E">4  Azure Firewall -> AVD Gateway, allow (AVD FQDN tag)</text><rect x="60" y="600" width="630" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="621" font-size="11" fill="#243A5E">5  Azure Firewall -> Microsoft 365, allow</text><rect x="720" y="600" width="630" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="734" y="621" font-size="11" fill="#243A5E">6  Azure Firewall -> Blocked, deny (everything else)</text><rect x="60" y="640" width="630" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="661" font-size="11" fill="#243A5E">7  Azure Firewall -> ExpressRoute Gateway, corporate traffic</text><rect x="720" y="640" width="630" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="734" y="661" font-size="11" fill="#243A5E">8  ExpressRoute Gateway -> File Servers, ExpressRoute</text><rect x="40" y="725" width="340" height="88" rx="6" fill="#FFFFFF" stroke="#D8DDE3"/><text x="52" y="745" font-size="12" font-weight="700" fill="#243A5E">Legend</text><path d="M52,761 L92,761" stroke="#243A5E" stroke-width="2.4" /><text x="102" y="765" font-size="11" fill="#605E5C">Outbound session/control path</text><path d="M52,781 L92,781" stroke="#A4262C" stroke-width="2.4" /><text x="102" y="785" font-size="11" fill="#605E5C">Denied by default</text><path d="M52,801 L92,801" stroke="#8A7A5C" stroke-width="2.4" /><text x="102" y="805" font-size="11" fill="#605E5C">Corporate traffic, ExpressRoute</text><text x="40" y="840" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Self-contained shapes, no remote icon dependency.</text></svg>
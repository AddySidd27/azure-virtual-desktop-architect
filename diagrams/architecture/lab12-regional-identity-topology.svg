<text x="40" y="46" font-size="22" font-weight="600" fill="#243A5E">Lab 12 - regional identity topology</text>
<text x="40" y="70" font-size="13" fill="#605E5C">Lab 12 | Matches terraform/lab12-regional-identity exactly | one forest, avdlab.local, two domain controllers, two AD sites</text>
<line x1="40" y1="84" x2="1460" y2="84" stroke="#E1E5EA"/>
<rect x="40" y="100" width="660" height="200" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">EASTUS2 - AD SITE: DEFAULT-FIRST-SITE-NAME (LAB 4)</text><g><rect x="70" y="145" width="600" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="87" y="159.5" width="26" height="26" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="100" cy="172.5" r="6" fill="none" stroke="#243A5E" stroke-width="1.7"/><text x="128" y="175" font-size="13" font-weight="600" fill="#243A5E">vm-avdlab-dc01</text><text x="128" y="191" font-size="11" fill="#605E5C">10.10.1.4, computer name AVDLAB-DC01</text></g><g><rect x="70" y="220" width="600" height="55" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><circle cx="100" cy="239.5" r="4" fill="none" stroke="#605E5C" stroke-width="2"/><circle cx="90" cy="255.5" r="4" fill="none" stroke="#605E5C" stroke-width="2"/><circle cx="110" cy="255.5" r="4" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M100,243.5 L90,251.5 M100,243.5 L110,251.5" stroke="#605E5C" stroke-width="1.7"/><text x="128" y="250" font-size="13" font-weight="600" fill="#243A5E">snet-identity-lab-eus2-01</text><text x="128" y="266" font-size="11" fill="#605E5C">10.10.1.0/24</text></g><rect x="780" y="100" width="660" height="200" rx="8" fill="#F3FAF3" stroke="#107C10" stroke-width="1.8" /><text x="794" y="122" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">CENTRALUS - AD SITE: CENTRALUS-SITE (LAB 12)</text><g><rect x="810" y="145" width="600" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="827" y="159.5" width="26" height="26" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="840" cy="172.5" r="6" fill="none" stroke="#243A5E" stroke-width="1.7"/><text x="868" y="175" font-size="13" font-weight="600" fill="#243A5E">vm-avdlab-dc02</text><text x="868" y="191" font-size="11" fill="#605E5C">10.20.1.4, computer name AVDLAB-DC02</text></g><g><rect x="810" y="220" width="600" height="55" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><circle cx="840" cy="239.5" r="4" fill="none" stroke="#605E5C" stroke-width="2"/><circle cx="830" cy="255.5" r="4" fill="none" stroke="#605E5C" stroke-width="2"/><circle cx="850" cy="255.5" r="4" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M840,243.5 L830,251.5 M840,243.5 L850,251.5" stroke="#605E5C" stroke-width="1.7"/><text x="868" y="250" font-size="13" font-weight="600" fill="#243A5E">snet-identity-lab-cus-01</text><text x="868" y="266" font-size="11" fill="#605E5C">10.20.1.0/24</text></g><path d="M700,175 L780,175" stroke="#B77300" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="657.75" y="143" width="164.5" height="17" rx="3" fill="#FFFFFF" opacity="0.95"/><text x="740" y="155" font-size="11" fill="#B77300" text-anchor="middle">AD replication (RPC/SMTP)</text><path d="M780,240 L700,240" stroke="#B77300" stroke-width="2" fill="none"  marker-end="url(#a)"/><rect x="40" y="340" width="1400" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="362" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="380" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="401" font-size="11" fill="#243A5E">1  Install-ADDSDomainController joins vm-avdlab-dc02 to the existing avdlab.local forest, not a new forest</text><rect x="60" y="420" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="441" font-size="11" fill="#243A5E">2  New-ADReplicationSite creates centralus-Site; New-ADReplicationSubnet maps 10.20.0.0/16 to it</text><rect x="60" y="460" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="481" font-size="11" fill="#243A5E">3  vm-avdlab-dc01 and vm-avdlab-dc02 replicate the directory to each other over the Lab 11 peering link</text><rect x="60" y="500" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="521" font-size="11" fill="#B77300">4  Once replication is confirmed, both VNets' DNS servers are updated: eastus2 primary 10.10.1.4 / secondary 10.20.1.4, centralus primary 10.20.1.4 / secondary 10.10.1.4</text><rect x="60" y="540" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="561" font-size="11" fill="#243A5E">5  A session host in either region now resolves against its own local DC first, falling back to the other region's DC only if the local one is unavailable</text><text x="40" y="620" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against terraform/lab12-regional-identity, August 2026. Self-contained shapes, no remote icon dependency.</text></svg>
<rect width="1500" height="700" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="600" fill="#243A5E">Lab 16 - user-to-region assignment</text>
<text x="40" y="70" font-size="13" fill="#605E5C">Lab 16 | Matches terraform/lab16-region-assignment exactly | non-overlapping group membership prevents the Lab 15 lock-violation failure</text>
<line x1="40" y1="84" x2="1460" y2="84" stroke="#E1E5EA"/>
<rect x="40" y="100" width="660" height="260" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">EASTUS2 GROUPS</text><g><rect x="70" y="140" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="90" y="153.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M95,160.0 h10 M95,165.0 h10 M95,170.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="128" y="170" font-size="13" font-weight="600" fill="#243A5E">grp-avdlab-finance-eus2</text><text x="128" y="186" font-size="11" fill="#605E5C">Desktop Virtualization User</text></g><g><rect x="70" y="200" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="90" y="213.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M95,220.0 h10 M95,225.0 h10 M95,230.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="128" y="230" font-size="13" font-weight="600" fill="#243A5E">grp-avdlab-support-eus2</text><text x="128" y="246" font-size="11" fill="#605E5C">Desktop Virtualization User</text></g><g><rect x="70" y="260" width="600" height="55" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><circle cx="100" cy="287.5" r="12" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M95,287.5 l4,4 l7,-8" fill="none" stroke="#605E5C" stroke-width="2"/><text x="128" y="290" font-size="13" font-weight="600" fill="#243A5E">ag-desktop-lab-eus2-01</text><text x="128" y="306" font-size="11" fill="#605E5C">eastus2 application group (Lab 7)</text></g><rect x="780" y="100" width="660" height="260" rx="8" fill="#F3FAF3" stroke="#107C10" stroke-width="1.8" /><text x="794" y="122" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">CENTRALUS GROUPS</text><g><rect x="810" y="140" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="830" y="153.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M835,160.0 h10 M835,165.0 h10 M835,170.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="868" y="170" font-size="13" font-weight="600" fill="#243A5E">grp-avdlab-finance-cus</text><text x="868" y="186" font-size="11" fill="#605E5C">Desktop Virtualization User</text></g><g><rect x="810" y="200" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="830" y="213.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M835,220.0 h10 M835,225.0 h10 M835,230.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="868" y="230" font-size="13" font-weight="600" fill="#243A5E">grp-avdlab-support-cus</text><text x="868" y="246" font-size="11" fill="#605E5C">Desktop Virtualization User</text></g><g><rect x="810" y="260" width="600" height="55" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><circle cx="840" cy="287.5" r="12" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M835,287.5 l4,4 l7,-8" fill="none" stroke="#605E5C" stroke-width="2"/><text x="868" y="290" font-size="13" font-weight="600" fill="#243A5E">ag-desktop-lab-cus-01</text><text x="868" y="306" font-size="11" fill="#605E5C">centralus application group (Lab 14)</text></g><rect x="40" y="400" width="1400" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="422" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS AND DESIGN NOTES (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="440" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="461" font-size="11" fill="#243A5E">1  Each population gets TWO groups, one per region - never one shared group spanning both</text><rect x="60" y="480" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="501" font-size="11" fill="#243A5E">2  grp-avdlab-finance-eus2 scopes ONLY to ag-desktop-lab-eus2-01 - it has no role assignment on the centralus application group at all</text><rect x="60" y="520" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="541" font-size="11" fill="#243A5E">3  A finance user is placed in grp-avdlab-finance-eus2 OR grp-avdlab-finance-cus, never both - this is a manual/HR decision, not automated by this lab</text><rect x="60" y="560" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="581" font-size="11" fill="#B77300">4  This is the control that prevents Lab 15's ERROR_LOCK_VIOLATION: a user simply cannot reach both regions' desktops at once</text><rect x="60" y="600" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="621" font-size="11" fill="#243A5E">5  Moving a user between regions is a deliberate, documented group-membership change, not a runtime routing decision</text><text x="40" y="680" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against terraform/lab16-region-assignment, August 2026. Self-contained shapes, no remote icon dependency.</text></svg>
<text x="40" y="46" font-size="22" font-weight="600" fill="#243A5E">Lab 17 - regional autoscaling schedules</text>
<text x="40" y="70" font-size="13" fill="#605E5C">Lab 17 | Matches terraform/lab17-regional-autoscaling exactly | Power Management Autoscale, two independent schedules</text>
<line x1="40" y1="84" x2="1460" y2="84" stroke="#E1E5EA"/>
<rect x="40" y="100" width="1420" height="110" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">EASTUS2 - SP-AVD-LAB-EUS2-01 (EASTERN STANDARD TIME)</text><g><rect x="60" y="140" width="340" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="80" y="153.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M85,160.0 h10 M85,165.0 h10 M85,170.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="118" y="170" font-size="13" font-weight="600" fill="#243A5E">Ramp-up, 07:00</text><text x="118" y="186" font-size="11" fill="#605E5C">min 50%, threshold 80%</text></g><g><rect x="410" y="140" width="340" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="430" y="153.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M435,160.0 h10 M435,165.0 h10 M435,170.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="468" y="170" font-size="13" font-weight="600" fill="#243A5E">Peak, 09:00</text><text x="468" y="186" font-size="11" fill="#605E5C">BreadthFirst</text></g><g><rect x="760" y="140" width="340" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="780" y="153.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M785,160.0 h10 M785,165.0 h10 M785,170.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="818" y="170" font-size="13" font-weight="600" fill="#243A5E">Ramp-down, 18:00</text><text x="818" y="186" font-size="11" fill="#605E5C">min 10%, wait 30min</text></g><g><rect x="1110" y="140" width="340" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="1130" y="153.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M1135,160.0 h10 M1135,165.0 h10 M1135,170.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="1168" y="170" font-size="13" font-weight="600" fill="#243A5E">Off-peak, 20:00</text><text x="1168" y="186" font-size="11" fill="#605E5C">DepthFirst</text></g><rect x="40" y="230" width="1420" height="110" rx="8" fill="#F3FAF3" stroke="#107C10" stroke-width="1.8" /><text x="54" y="252" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">CENTRALUS - SP-AVD-LAB-CUS-01 (CENTRAL STANDARD TIME)</text><g><rect x="60" y="270" width="340" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="80" y="283.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M85,290.0 h10 M85,295.0 h10 M85,300.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="118" y="300" font-size="13" font-weight="600" fill="#243A5E">Ramp-up, 06:00</text><text x="118" y="316" font-size="11" fill="#605E5C">min 60%, threshold 75%</text></g><g><rect x="410" y="270" width="340" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="430" y="283.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M435,290.0 h10 M435,295.0 h10 M435,300.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="468" y="300" font-size="13" font-weight="600" fill="#243A5E">Peak, 08:00</text><text x="468" y="316" font-size="11" fill="#605E5C">BreadthFirst</text></g><g><rect x="760" y="270" width="340" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="780" y="283.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M785,290.0 h10 M785,295.0 h10 M785,300.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="818" y="300" font-size="13" font-weight="600" fill="#243A5E">Ramp-down, 17:00</text><text x="818" y="316" font-size="11" fill="#605E5C">min 15%, wait 45min</text></g><g><rect x="1110" y="270" width="340" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="1130" y="283.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M1135,290.0 h10 M1135,295.0 h10 M1135,300.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="1168" y="300" font-size="13" font-weight="600" fill="#243A5E">Off-peak, 21:00</text><text x="1168" y="316" font-size="11" fill="#605E5C">DepthFirst</text></g><rect x="40" y="360" width="1420" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="382" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS AND DESIGN NOTES (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="400" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="421" font-size="11" fill="#243A5E">1  Two independent azurerm_virtual_desktop_scaling_plan resources - not one plan applied to both host pools</text><rect x="60" y="440" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="461" font-size="11" fill="#B77300">2  centralus ramps up an hour earlier and ramps down an hour earlier than eastus2 - genuinely different demand assumptions, not a copy</text><rect x="60" y="480" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="501" font-size="11" fill="#243A5E">3  Each plan's host_pool_association scopes it to exactly one region's host pool - a scaling event in one region cannot affect the other</text><rect x="60" y="520" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="541" font-size="11" fill="#243A5E">4  A VM tagged with the autoscale_exclusion_tag_name value is skipped by that region's plan entirely, regardless of schedule phase</text><rect x="60" y="560" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="581" font-size="11" fill="#243A5E">5  Start VM on Connect (set on both host pools in Lab 14) lets a user reach a deallocated host outside its scaling plan's ramp-up window</text><text x="40" y="640" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against terraform/lab17-regional-autoscaling, August 2026. Self-contained shapes, no remote icon dependency.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#243A5E"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#107C10"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A4262C"/></marker>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7FAFD"/></linearGradient>
</defs>
<rect width="1500" height="700" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="600" fill="#243A5E">Lab 14 vs Lab 19 - active-active compared against active-passive</text>
<text x="40" y="70" font-size="13" fill="#605E5C">These are different patterns solving different problems - not one being a correction of the other</text>
<line x1="40" y1="84" x2="1460" y2="84" stroke="#E1E5EA"/>
<rect x="40" y="100" width="660" height="300" rx="8" fill="#F3FAF3" stroke="#107C10" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">LAB 14 - ACTIVE-ACTIVE (CENTRALUS)</text><g><rect x="70" y="140" width="600" height="50" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><rect x="90" y="153.0" width="20" height="24" rx="2" fill="none" stroke="#107C10" stroke-width="2"/><path d="M95,160.0 h10 M95,165.0 h10 M95,170.0 h6" stroke="#107C10" stroke-width="1.7"/><text x="128" y="170" font-size="13" font-weight="600" fill="#243A5E">RTO</text><text x="128" y="186" font-size="11" fill="#605E5C">Near-zero - no admin intervention needed</text></g><g><rect x="70" y="200" width="600" height="50" rx="6" fill="url(#tile)" stroke="#A4262C" stroke-width="1.6"/><rect x="90" y="213.0" width="20" height="24" rx="2" fill="none" stroke="#A4262C" stroke-width="2"/><path d="M95,220.0 h10 M95,225.0 h10 M95,230.0 h6" stroke="#A4262C" stroke-width="1.7"/><text x="128" y="230" font-size="13" font-weight="600" fill="#243A5E">Steady-state cost</text><text x="128" y="246" font-size="11" fill="#605E5C">High - dual compute, dual storage, always on</text></g><g><rect x="70" y="260" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="90" y="273.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M95,280.0 h10 M95,285.0 h10 M95,290.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="128" y="290" font-size="13" font-weight="600" fill="#243A5E">User experience</text><text x="128" y="306" font-size="11" fill="#605E5C">Duplicate feed by design, two labelled desktops</text></g><g><rect x="70" y="320" width="600" height="55" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><rect x="90" y="335.5" width="20" height="24" rx="2" fill="none" stroke="#107C10" stroke-width="2"/><path d="M95,342.5 h10 M95,347.5 h10 M95,352.5 h6" stroke="#107C10" stroke-width="1.7"/><text x="128" y="350" font-size="13" font-weight="600" fill="#243A5E">Activation</text><text x="128" y="366" font-size="11" fill="#605E5C">None needed - both regions already serving users</text></g><rect x="780" y="100" width="660" height="300" rx="8" fill="#FDF6EC" stroke="#B77300" stroke-width="1.8" /><text x="794" y="122" font-size="12.5" font-weight="700" fill="#B77300" letter-spacing="0.5">LAB 19 - ACTIVE-PASSIVE (WESTUS2)</text><g><rect x="810" y="140" width="600" height="50" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><rect x="830" y="153.0" width="20" height="24" rx="2" fill="none" stroke="#B77300" stroke-width="2"/><path d="M835,160.0 h10 M835,165.0 h10 M835,170.0 h6" stroke="#B77300" stroke-width="1.7"/><text x="868" y="170" font-size="13" font-weight="600" fill="#243A5E">RTO</text><text x="868" y="186" font-size="11" fill="#605E5C">15-60 minutes - admin-triggered failover runbook</text></g><g><rect x="810" y="200" width="600" height="50" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><rect x="830" y="213.0" width="20" height="24" rx="2" fill="none" stroke="#107C10" stroke-width="2"/><path d="M835,220.0 h10 M835,225.0 h10 M835,230.0 h6" stroke="#107C10" stroke-width="1.7"/><text x="868" y="230" font-size="13" font-weight="600" fill="#243A5E">Steady-state cost</text><text x="868" y="246" font-size="11" fill="#605E5C">Low - deallocated hosts, capacity reservation only</text></g><g><rect x="810" y="260" width="600" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="830" y="273.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M835,280.0 h10 M835,285.0 h10 M835,290.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="868" y="290" font-size="13" font-weight="600" fill="#243A5E">User experience</text><text x="868" y="306" font-size="11" fill="#605E5C">No duplicate feed - same desktop entry, re-pointed</text></g><g><rect x="810" y="320" width="600" height="55" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><rect x="830" y="335.5" width="20" height="24" rx="2" fill="none" stroke="#B77300" stroke-width="2"/><path d="M835,342.5 h10 M835,347.5 h10 M835,352.5 h6" stroke="#B77300" stroke-width="1.7"/><text x="868" y="350" font-size="13" font-weight="600" fill="#243A5E">Activation</text><text x="868" y="366" font-size="11" fill="#605E5C">Deliberate, documented, human-triggered failover</text></g><rect x="40" y="440" width="1400" height="215" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="462" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">WHAT THIS COMPARISON IS ACTUALLY FOR</text><rect x="60" y="480" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="501" font-size="11" fill="#243A5E">1  Same book, same reader, two genuinely different answers to what happens when a region fails - not a better and worse version of one idea</text><rect x="60" y="520" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="541" font-size="11" fill="#243A5E">2  Lab 14 costs more every month and recovers with zero delay; Lab 19 costs less every month and recovers with a documented delay</text><rect x="60" y="560" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="581" font-size="11" fill="#243A5E">3  Choosing between them is a business decision, how much does downtime cost versus how much does always-on redundancy cost, not a technical one</text><rect x="60" y="600" width="1360" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="621" font-size="11" fill="#243A5E">4  A reader who has built both can defend either choice with real numbers, not just a textbook definition of the pattern</text><text x="40" y="680" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. RTO and cost figures sourced from Azure Architecture Center BCDR guidance and this lab set's own Terraform. Self-contained shapes, no remote icon dependency.</text></svg>
<text x="40" y="42" font-size="21" font-weight="600" fill="#243A5E">Northwind Terraform Implementation: state architecture at a glance</text>
<text x="40" y="66" font-size="12.5" fill="#605E5C">Capstone Part G | Three backends, one per layer - closing the gap where zero backend.tf files existed before this part</text>
<line x1="40" y1="78" x2="1460" y2="78" stroke="#E1E5EA"/>
<rect x="60" y="100" width="440" height="360" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8"/><text x="74" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">PLATFORM BACKEND</text><rect x="80" y="140" width="400" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="90" y="158" font-size="13" font-weight="600" fill="#243A5E">sttfstatenwplat01</text><text x="90" y="172" font-size="9.5" fill="#605E5C">rg-tfstate-platform-01</text><rect x="80" y="205" width="195" height="40" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="90" y="223" font-size="10" font-weight="600" fill="#243A5E">management-groups</text><text x="90" y="237" font-size="8.3" fill="#605E5C">platform-management-groups.tfstate</text><rect x="285" y="205" width="195" height="40" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="295" y="223" font-size="10" font-weight="600" fill="#243A5E">policy</text><text x="295" y="237" font-size="8.3" fill="#605E5C">platform-policy.tfstate</text><rect x="80" y="250" width="195" height="40" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="90" y="268" font-size="10" font-weight="600" fill="#243A5E">identity</text><text x="90" y="282" font-size="8.3" fill="#605E5C">platform-identity.tfstate</text><rect x="285" y="250" width="195" height="40" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="295" y="268" font-size="10" font-weight="600" fill="#243A5E">connectivity</text><text x="295" y="282" font-size="8.3" fill="#605E5C">platform-connectivity.tfstate</text><rect x="80" y="295" width="195" height="40" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="90" y="313" font-size="10" font-weight="600" fill="#243A5E">security</text><text x="90" y="327" font-size="8.3" fill="#605E5C">platform-security.tfstate</text><rect x="285" y="295" width="195" height="40" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="295" y="313" font-size="10" font-weight="600" fill="#243A5E">rbac</text><text x="295" y="327" font-size="8.3" fill="#605E5C">platform-rbac.tfstate</text><rect x="80" y="340" width="195" height="40" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="90" y="358" font-size="10" font-weight="600" fill="#243A5E">monitoring</text><text x="90" y="372" font-size="8.3" fill="#605E5C">platform-monitoring.tfstate</text><rect x="285" y="340" width="195" height="40" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="295" y="358" font-size="10" font-weight="600" fill="#243A5E">finops</text><text x="295" y="372" font-size="8.3" fill="#605E5C">platform-finops.tfstate</text><rect x="540" y="100" width="420" height="360" rx="8" fill="#F3FAF3" stroke="#107C10" stroke-width="1.8"/><text x="554" y="122" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">AVD LANDING ZONE BACKEND</text><rect x="560" y="140" width="380" height="50" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="570" y="158" font-size="13" font-weight="600" fill="#107C10">sttfstatenwavdlz01</text><text x="570" y="172" font-size="9.5" fill="#605E5C">rg-tfstate-avdlz-01</text><rect x="560" y="205" width="380" height="42" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="570" y="223" font-size="11" font-weight="600" fill="#107C10">network-spokes</text><text x="570" y="237" font-size="9.5" fill="#605E5C">avdlz-network-spokes.tfstate</text><rect x="560" y="255" width="380" height="42" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="570" y="273" font-size="11" font-weight="600" fill="#107C10">policy</text><text x="570" y="287" font-size="9.5" fill="#605E5C">avdlz-policy.tfstate</text><rect x="560" y="305" width="380" height="42" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="570" y="323" font-size="11" font-weight="600" fill="#107C10">rbac</text><text x="570" y="337" font-size="9.5" fill="#605E5C">avdlz-rbac.tfstate</text><rect x="1000" y="100" width="460" height="360" rx="8" fill="#FDF6EC" stroke="#B77300" stroke-width="1.8"/><text x="1014" y="122" font-size="12.5" font-weight="700" fill="#B77300" letter-spacing="0.5">AVD PLATFORM BACKEND (partial config)</text><rect x="1020" y="140" width="420" height="50" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><text x="1030" y="158" font-size="13" font-weight="600" fill="#B77300">sttfstatenwavdplt01</text><text x="1030" y="172" font-size="9.5" fill="#605E5C">rg-tfstate-avdplt-01</text><rect x="1020" y="205" width="420" height="42" rx="6" fill="#FDF6EC" stroke="#B77300" stroke-width="1.6" stroke-dasharray="6,4"/><text x="1030" y="223" font-size="11" font-weight="600" fill="#B77300">host-pools</text><text x="1030" y="237" font-size="9.5" fill="#605E5C">key supplied at init - applied per region, x2</text><rect x="1020" y="255" width="420" height="42" rx="6" fill="#FDF6EC" stroke="#B77300" stroke-width="1.6" stroke-dasharray="6,4"/><text x="1030" y="273" font-size="11" font-weight="600" fill="#B77300">workspace-appgroups</text><text x="1030" y="287" font-size="9.5" fill="#605E5C">key supplied at init - applied per region, x2</text><rect x="1020" y="305" width="420" height="42" rx="6" fill="#FDF6EC" stroke="#B77300" stroke-width="1.6" stroke-dasharray="6,4"/><text x="1030" y="323" font-size="11" font-weight="600" fill="#B77300">fslogix</text><text x="1030" y="337" font-size="9.5" fill="#605E5C">key supplied at init - applied per region, x2</text><path d="M760,460 L760,490 L280,490 L280,462" stroke="#107C10" stroke-width="2.2" fill="none" marker-end="url(#arrow-107C10)"/><rect x="460" y="478" width="220" height="17" rx="3" fill="#FFFFFF"/><text x="570" y="490" font-size="10" fill="#107C10" text-anchor="middle">network-spokes reads platform</text><path d="M1210,460 L1210,525 L760,525 L760,494" stroke="#B77300" stroke-width="2.2" fill="none" marker-end="url(#arrow-B77300)"/><rect x="870" y="513" width="290" height="17" rx="3" fill="#FFFFFF"/><text x="1015" y="525" font-size="10" fill="#B77300" text-anchor="middle">avd-platform reads network-spokes + identity + monitoring</text><rect x="40" y="580" width="1420" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8"/><text x="54" y="602" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">HOW TO READ THIS IN 60 SECONDS</text><rect x="60" y="620" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.4"/><text x="74" y="641" font-size="10.5" fill="#243A5E">1  Zero backend.tf files existed anywhere before this part - every cross-module wire-up was manual tfvars copy-paste, not the terraform_remote_state pattern Labs 11-20 already proved.</text><rect x="60" y="660" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#107C10" stroke-width="1.4"/><text x="74" y="681" font-size="10.5" fill="#107C10">2  Three backends, not one and not fourteen - one per layer, respecting the exact platform/workload ownership boundary maintained since Part A.</text><rect x="60" y="700" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300" stroke-width="1.4"/><text x="74" y="721" font-size="10.5" fill="#B77300">3  host-pools, workspace-appgroups, and fslogix use PARTIAL backend config - applied twice per region from identical code, so the state key must be supplied at init time, never hardcoded.</text><rect x="60" y="740" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300" stroke-width="1.4"/><text x="74" y="761" font-size="10.5" fill="#B77300">4  A real error caught during this part's own build: workspace-appgroups -> host-pools was first mislabeled cross-layer. It's within avd-platform. The genuine cross-layer read (network-spokes) had been missed and is now fixed.</text><rect x="60" y="780" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#605E5C" stroke-width="1.4"/><text x="74" y="801" font-size="10.5" fill="#605E5C">5  Within-platform-layer references (rbac -> security, finops -> subscriptions) remain manual - a disclosed, unconverted item, not claimed done.</text><text x="40" y="855" font-size="10.5" fill="#605E5C">Original architecture diagram for this capstone, not Microsoft's. Verified against terraform/capstone-northwind and Part G, August 2026. Self-contained, no remote icon dependency.</text></svg>
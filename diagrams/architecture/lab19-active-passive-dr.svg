<rect x="40" y="100" width="440" height="220" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">EASTUS2 - PROTECTED REGION (LABS 1-10)</text><g><rect x="60" y="140" width="400" height="50" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><rect x="75" y="154.0" width="14" height="10" rx="1.5" fill="none" stroke="#107C10" stroke-width="2"/><rect x="92" y="154.0" width="14" height="10" rx="1.5" fill="none" stroke="#107C10" stroke-width="2"/><rect x="83" y="167.0" width="14" height="10" rx="1.5" fill="none" stroke="#107C10" stroke-width="2"/><text x="118" y="170" font-size="13" font-weight="600" fill="#243A5E">hp-avd-lab-eus2-01</text><text x="118" y="186" font-size="11" fill="#605E5C">Active, serving live users</text></g><g><rect x="60" y="200" width="400" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="90" cy="225.0" r="12" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M85,225.0 l4,4 l7,-8" fill="none" stroke="#243A5E" stroke-width="2"/><text x="118" y="230" font-size="13" font-weight="600" fill="#243A5E">ws-avdlab-lab-eus2-01</text><text x="118" y="246" font-size="11" fill="#605E5C">Single shared workspace</text></g><g><rect x="60" y="260" width="400" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="77" y="274.5" width="26" height="26" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="90" cy="287.5" r="6" fill="none" stroke="#243A5E" stroke-width="1.7"/><text x="118" y="290" font-size="13" font-weight="600" fill="#243A5E">vm-avdlab-dc01</text><text x="118" y="306" font-size="11" fill="#605E5C">DNS secondary for DR hosts</text></g><rect x="530" y="100" width="440" height="220" rx="8" fill="#F3FAF3" stroke="#107C10" stroke-width="1.8" /><text x="544" y="122" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">CENTRALUS - IDENTITY BACKSTOP FOR DR</text><g><rect x="550" y="140" width="400" height="50" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><rect x="565" y="154.0" width="14" height="10" rx="1.5" fill="none" stroke="#107C10" stroke-width="2"/><rect x="582" y="154.0" width="14" height="10" rx="1.5" fill="none" stroke="#107C10" stroke-width="2"/><rect x="573" y="167.0" width="14" height="10" rx="1.5" fill="none" stroke="#107C10" stroke-width="2"/><text x="608" y="170" font-size="13" font-weight="600" fill="#243A5E">hp-avd-lab-cus-01</text><text x="608" y="186" font-size="11" fill="#605E5C">Active, unaffected by eastus2</text></g><g><rect x="550" y="200" width="400" height="55" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><rect x="567" y="214.5" width="26" height="26" rx="2" fill="none" stroke="#107C10" stroke-width="2"/><circle cx="580" cy="227.5" r="6" fill="none" stroke="#107C10" stroke-width="1.7"/><text x="608" y="230" font-size="13" font-weight="600" fill="#243A5E">vm-avdlab-dc02</text><text x="608" y="246" font-size="11" fill="#605E5C">DNS PRIMARY for DR hosts</text></g><g><rect x="550" y="260" width="400" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="570" y="273.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M575,280.0 h10 M575,285.0 h10 M575,290.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="608" y="290" font-size="13" font-weight="600" fill="#243A5E">centralus-Site</text><text x="608" y="306" font-size="11" fill="#605E5C">westus2 subnet mapped here</text></g><rect x="1020" y="100" width="440" height="220" rx="8" fill="#FDF6EC" stroke="#B77300" stroke-width="1.8" /><text x="1034" y="122" font-size="12.5" font-weight="700" fill="#B77300" letter-spacing="0.5">WESTUS2 - DR TARGET (LAB 19)</text><g><rect x="1040" y="140" width="400" height="50" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><rect x="1055" y="154.0" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><rect x="1072" y="154.0" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><rect x="1063" y="167.0" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><text x="1098" y="170" font-size="13" font-weight="600" fill="#243A5E">hp-avd-dr-lab-wus2-01</text><text x="1098" y="186" font-size="11" fill="#605E5C">Standing, host count = 0</text></g><g><rect x="1040" y="200" width="400" height="55" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><circle cx="1070" cy="219.5" r="4" fill="none" stroke="#107C10" stroke-width="2"/><circle cx="1060" cy="235.5" r="4" fill="none" stroke="#107C10" stroke-width="2"/><circle cx="1080" cy="235.5" r="4" fill="none" stroke="#107C10" stroke-width="2"/><path d="M1070,223.5 L1060,231.5 M1070,223.5 L1080,231.5" stroke="#107C10" stroke-width="1.7"/><text x="1098" y="230" font-size="13" font-weight="600" fill="#243A5E">peer-wus2-to-cus</text><text x="1098" y="246" font-size="11" fill="#605E5C">PRIMARY identity path</text></g><g><rect x="1040" y="260" width="400" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="1070" cy="277.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="1060" cy="293.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="1080" cy="293.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M1070,281.0 L1060,289.0 M1070,281.0 L1080,289.0" stroke="#243A5E" stroke-width="1.7"/><text x="1098" y="290" font-size="13" font-weight="600" fill="#243A5E">peer-wus2-to-eus2</text><text x="1098" y="306" font-size="11" fill="#605E5C">Secondary, not depended on alone</text></g><rect x="40" y="360" width="1420" height="295" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="382" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS AND DESIGN NOTES (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="400" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="421" font-size="11" fill="#B77300">1  CORRECTED: westus2 peers to BOTH centralus and eastus2 - the original design peered to eastus2 only, which had no working identity path during an eastus2 outage</text><rect x="60" y="440" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="461" font-size="11" fill="#243A5E">2  DR session host DNS order: centralus DC first (10.20.1.4), eastus2 DC second - centralus survives an eastus2 failure, so it is the primary path, not a fallback</text><rect x="60" y="480" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="501" font-size="11" fill="#243A5E">3  westus2's subnet (10.30.0.0/16) is mapped to centralus-Site in AD Sites and Services - no dedicated westus2 domain controller needed</text><rect x="60" y="520" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="541" font-size="11" fill="#243A5E">4  During an eastus2 outage: DR session hosts authenticate via centralus only - the failed region is never in the authentication path</text><rect x="60" y="560" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="581" font-size="11" fill="#B77300">5  Capacity reservation is OFF by default (enable_capacity_reservation=false) - bills continuously at full VM rate when enabled, confirmed against Microsoft's own documentation</text><rect x="60" y="600" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="621" font-size="11" fill="#243A5E">6  No new workspace: a failed-over user's desktop entry is the SAME one they always had, now pointing at westus2 infrastructure</text><text x="40" y="680" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Corrected pass: identity dependency on failed region removed. Verified against terraform/lab19-dr-failover, August 2026. Self-contained shapes, no remote icon dependency.</text></svg>
" y="188.0" width="12" height="3" fill="#243A5E"/><text x="778" y="186" font-size="13" font-weight="600" fill="#243A5E">Session Host</text></g><rect x="40" y="280" width="920" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="302" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="320" width="880" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="341" font-size="11" fill="#243A5E">1  Windows App -> AVD Gateway, TCP 443 (always established first)</text><rect x="60" y="360" width="880" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="381" font-size="11" fill="#243A5E">2  AVD Gateway -> Session Host, reverse connect (fallback path, always works)</text><rect x="60" y="400" width="880" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="421" font-size="11" fill="#243A5E">3  Windows App -> Session Host, UDP 3390 (Shortpath, managed network)</text><rect x="60" y="440" width="880" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="461" font-size="11" fill="#243A5E">4  Windows App -> STUN/TURN, UDP 3478 (public network negotiation)</text><rect x="60" y="480" width="880" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="501" font-size="11" fill="#243A5E">5  STUN/TURN -> Session Host, Shortpath established (public network)</text><rect x="40" y="565" width="340" height="68" rx="6" fill="#FFFFFF" stroke="#D8DDE3"/><text x="52" y="585" font-size="12" font-weight="700" fill="#243A5E">Legend</text><path d="M52,601 L92,601" stroke="#243A5E" stroke-width="2.4" /><text x="102" y="605" font-size="11" fill="#605E5C">Reverse connect (always established)</text><path d="M52,621 L92,621" stroke="#107C10" stroke-width="2.4" stroke-dasharray="7 5"/><text x="102" y="625" font-size="11" fill="#605E5C">Shortpath (optimisation, attempted in parallel)</text><text x="40" y="65
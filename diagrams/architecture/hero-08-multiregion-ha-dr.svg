<rect width="1580" height="760" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="600" fill="#243A5E">Multi-region HA and DR architecture for AVD</text>
<text x="40" y="70" font-size="13" fill="#605E5C">Hero diagram 8 | Related: Project 09 (Bengaluru case), Chapter 20 redundancy | Data location can matter more than latency</text>
<line x1="40" y1="84" x2="1540" y2="84" stroke="#E1E5EA"/>
<rect x="40" y="100" width="700" height="300" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">PRIMARY REGION</text><g><rect x="60" y="140" width="320" height="60" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="75" y="159.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="92" y="159.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="83" y="172.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><text x="118" y="170" font-size="13" font-weight="600" fill="#243A5E">Host Pool - Primary</text><text x="118" y="186" font-size="11" fill="#605E5C">Desktop + RemoteApp</text></g><g><rect x="400" y="140" width="320" height="60" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="417" y="160.0" width="26" height="18" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="424" y="178.0" width="12" height="3" fill="#243A5E"/><text x="458" y="170" font-size="13" font-weight="600" fill="#243A5E">Session Hosts</text><text x="458" y="186" font-size="11" fill="#605E5C">3 availability zones</text></g><g><rect x="60" y="220" width="320" height="70" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="90" cy="248.0" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M77,248.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="118" y="250" font-size="13" font-weight="600" fill="#243A5E">Profile Storage</text><text x="118" y="266" font-size="11" fill="#605E5C">Premium, ZRS</text></g><g><rect x="400" y="220" width="320" height="70" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="417" y="242.0" width="26" height="26" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="430" cy="255.0" r="6" fill="none" stroke="#243A5E" stroke-width="1.7"/><text x="458" y="250" font-size="13" font-weight="600" fill="#243A5E">Domain Controllers</text><text x="458" y="266" font-size="11" fill="#605E5C">1 per zone</text></g><g><rect x="60" y="310" width="660" height="70" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><circle cx="90" cy="339.0" r="6" fill="none" stroke="#107C10" stroke-width="2"/><path d="M79,356.0 a11,9 0 0 1 22,0" fill="none" stroke="#107C10" stroke-width="2"/><text x="118" y="340" font-size="13" font-weight="600" fill="#243A5E">Users near this region</text><text x="118" y="356" font-size="11" fill="#605E5C">lower latency path</text></g><rect x="840" y="100" width="700" height="300" rx="8" fill="#FAF8F3" stroke="#8A7A5C" stroke-width="1.8" /><text x="854" y="122" font-size="12.5" font-weight="700" fill="#8A7A5C" letter-spacing="0.5">SECONDARY / DR REGION</text><g><rect x="860" y="140" width="320" height="60" rx="6" fill="url(#tile)" stroke="#8A7A5C" stroke-width="1.6"/><rect x="875" y="159.0" width="14" height="10" rx="1.5" fill="none" stroke="#8A7A5C" stroke-width="2"/><rect x="892" y="159.0" width="14" height="10" rx="1.5" fill="none" stroke="#8A7A5C" stroke-width="2"/><rect x="883" y="172.0" width="14" height="10" rx="1.5" fill="none" stroke="#8A7A5C" stroke-width="2"/><text x="918" y="170" font-size="13" font-weight="600" fill="#243A5E">Host Pool - Secondary</text><text x="918" y="186" font-size="11" fill="#605E5C">warm standby or rebuild-on-failover</text></g><g><rect x="1200" y="140" width="320" height="60" rx="6" fill="url(#tile)" stroke="#8A7A5C" stroke-width="1.6"/><rect x="1217" y="160.0" width="26" height="18" rx="2" fill="none" stroke="#8A7A5C" stroke-width="2"/><rect x="1224" y="178.0" width="12" height="3" fill="#8A7A5C"/><text x="1258" y="170" font-size="13" font-weight="600" fill="#243A5E">Session Hosts</text><text x="1258" y="186" font-size="11" fill="#605E5C">provisioned on failover</text></g><g><rect x="860" y="220" width="320" height="70" rx="6" fill="url(#tile)" stroke="#8A7A5C" stroke-width="1.6"/><ellipse cx="890" cy="248.0" rx="13" ry="4.5" fill="none" stroke="#8A7A5C" stroke-width="2"/><path d="M877,248.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#8A7A5C" stroke-width="2"/><text x="918" y="250" font-size="13" font-weight="600" fill="#243A5E">Profile Storage</text><text x="918" y="266" font-size="11" fill="#605E5C">GZRS if HDD, or separate DR copy</text></g><g><rect x="1200" y="220" width="320" height="70" rx="6" fill="url(#tile)" stroke="#8A7A5C" stroke-width="1.6"/><rect x="1217" y="242.0" width="26" height="26" rx="2" fill="none" stroke="#8A7A5C" stroke-width="2"/><circle cx="1230" cy="255.0" r="6" fill="none" stroke="#8A7A5C" stroke-width="1.7"/><text x="1258" y="250" font-size="13" font-weight="600" fill="#243A5E">Domain Controllers</text><text x="1258" y="266" font-size="11" fill="#605E5C">replica, or rebuild via IaC</text></g><g><rect x="860" y="310" width="660" height="70" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><path d="M890,333.0 l13,22 h-26 z" fill="none" stroke="#B77300" stroke-width="2"/><path d="M890,341.0 v6 M890,350.0 v1.5" stroke="#B77300" stroke-width="2"/><text x="918" y="340" font-size="13" font-weight="600" fill="#243A5E">Remote users accept latency</text><text x="918" y="356" font-size="11" fill="#605E5C">for a single copy of the data</text></g><rect x="40" y="440" width="1500" height="180" rx="8" fill="#FDF6F6" stroke="#A4262C" stroke-width="1.8" /><text x="54" y="462" font-size="12.5" font-weight="700" fill="#A4262C" letter-spacing="0.5">THE DECISION THIS DIAGRAM FORCES</text><g><rect x="60" y="475" width="480" height="80" rx="6" fill="url(#tile)" stroke="#A4262C" stroke-width="1.6"/><path d="M90,503.0 l13,22 h-26 z" fill="none" stroke="#A4262C" stroke-width="2"/><path d="M90,511.0 v6 M90,520.0 v1.5" stroke="#A4262C" stroke-width="2"/><text x="118" y="505" font-size="13" font-weight="600" fill="#243A5E">Premium storage + geo-redundancy</text><text x="118" y="521" font-size="11" fill="#605E5C">Not available together on one Azure Files share</text></g><g><rect x="560" y="475" width="480" height="80" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="580" y="503.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M585,510.0 h10 M585,515.0 h10 M585,520.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="618" y="505" font-size="13" font-weight="600" fill="#243A5E">Option A: Standard HDD + GZRS</text><text x="618" y="521" font-size="11" fill="#605E5C">Native geo-redundancy, lower IOPS ceiling</text></g><g><rect x="1060" y="475" width="480" height="80" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="1080" y="503.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M1085,510.0 h10 M1085,515.0 h10 M1085,520.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="1118" y="505" font-size="13" font-weight="600" fill="#243A5E">Option B: Premium + ZRS + Cloud Cache</text><text x="1118" y="521" font-size="11" fill="#605E5C">High IOPS, DR via a second Cloud Cache provider</text></g><path d="M390,170 L400,170" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M220,280 L220,310" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M1190,170 L1200,170" stroke="#8A7A5C" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M1020,280 L1020,310" stroke="#8A7A5C" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M740,250 L840,250" stroke="#107C10" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#ag)"/><rect x="701.65" y="228" width="176.7" height="17" rx="3" fill="#FFFFFF" opacity="0.95"/><text x="790" y="240" font-size="11" fill="#107C10" text-anchor="middle">async replication (if GZRS)</text><text x="40" y="655" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. The storage constraint is verified in Chapter 20.</text></svg>
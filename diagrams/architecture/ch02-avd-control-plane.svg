th="1.6"/><path d="M502,229.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#0078D4" stroke-width="2"/><text x="543" y="236" font-size="13" font-weight="600" fill="#243A5E">Diagnostics</text></g><rect x="700" y="100" width="340" height="150" rx="8" fill="#FFFFFF" stroke="#605E5C" stroke-width="1.8" /><text x="714" y="122" font-size="12.5" font-weight="700" fill="#605E5C" letter-spacing="0.5">DIRECTORY</text><g><rect x="720" y="145" width="300" height="60" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><ellipse cx="750" cy="168.0" rx="13" ry="4.5" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M737,168.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#605E5C" stroke-width="2"/><text x="778" y="181" font-size="13" font-weight="600" fill="#243A5E">Resource Directory</text></g><rect x="40" y="280" width="1000" height="220" rx="8" fill="#F5F9FD" stroke="#0078D4" stroke-width="1.8" /><text x="54" y="302" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">CUSTOMER AZURE</text><g><rect x="70" y="320" width="220" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="87" y="337.5" width="26" height="18" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="94" y="355.5" width="12" height="3" fill="#243A5E"/><text x="128" y="356" font-size="13" font-weight="600" fill="#243A5E">Session Hosts</text></g><g><rect x="330" y="320" width="220" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><path d="M360,336.5 l11,5 v7 a11,11 0 0 1 -11,10 a11,11 0 0 1 -11,-10 v-7 z" fill="none" stroke="#243A5E" stroke-width="2"/><text x="388" y="356" font-size="13" font-weight="600" fill="#243A5E">Microsoft Entra ID</text></g><g><rect x="590" y="320" width="220" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="607" y="334.5" width="26" height="26" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="620" cy="347.5" r="6" fill="none" stroke="#243A5E" stroke-width="1.7"/><text x="648" y="356" font-size="13" font-weight="600" fill="#243A5E">Domain Controller</text></g><g><rect x="70" y="395" width="220" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="100" cy="415.5" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M87,415.5 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="128" y="431" font-size="13" font-weight="600" fill="#243A5E">FSLogix Storage</text></g><g><rect x="330" y="395" width="220" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><path d="M347,430.5 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="388" y="431" font-size="13" font-weight="600" fill="#243A5E">Log Analytics</text></g><g><rect x="590" y="395" width="220" height="55" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><rect x="610" y="410.5" width="20" height="24" rx="2" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M615,417.5 h10 M615,422.5 h10 M615,427.5 h6" stroke="#605E5C" stroke-width="1.7"/><text x="648" y="431" font-size="13" font-weight="600" fill="#243A5E">Azure Resource Manager</text></g><rect x="40" y="530" width="1000" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="552" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="570" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="591" font-size="11" fill="#243A5E">1  Windows App -> Web Service, HTTPS 443 (feed discovery)</text><rect x="560" y="570" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="574" y="591" font-size="11" fill="#243A5E">2  Windows App -> Gateway, RDP (session data, reverse connect)</text><rect x="60" y="610" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="631" font-size="11" fill="#243A5E">3  Session Hosts -> Gateway, HTTPS 443 (reverse connect established)</text><rect x="560" y="610" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="574" y="631" font-size="11" fill="#243A5E">4  Broker -> Session Hosts (control: session assignment)</text><rect x="60" y="650" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="671" font-size="11" fill="#243A5E">5  Session Hosts -> Microsoft Entra ID (authentication)</text><rect x="560" y="650" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="574" y="671" font-size="11" fill="#243A5E">6  Session Hosts -> Domain Controller, Kerberos 88 (hybrid join only)</text><rect x="60" y="690" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="711" font-size="11" fill="#243A5E">7  Session Hosts -> FSLogix Storage, SMB 445 (profile mount)</text><rect x="560" y="690" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="574" y="711" font-size="11" fill="#243A5E">8  Session Hosts -> Diagnostics -> Log Analytics (telemetry, background)</text><rect x="60" y="730" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="751" font-size="11" fill="#243A5E">9  Azure Resource Manager -> Session Hosts (management plane, deploy/configure)</text><rect x="40" y="815" width="340" height="88" rx="6" fill="#FFFFFF" stroke="#D8DDE3"/><text x="52" y="835" font-size="12" font-weight="700" fill="#243A5E">Legend</text><path d="M52,851 L92,851" stroke="#243A5E" stroke-width="2.4" /><text x="102" y="855" font-size="11" fill="#605E5C">Control and session plane</text><path d="M52,871 L92,871" stroke="#107C10" stroke-width="2.4" stroke-dasharray="7 5"/><text x="102" y="875" font-size="11" fill="#605E5C">Telemetry (flow 8)</text><path d="M52,891 L92,891" stroke="#605E5C" stroke-width="2.4" stroke-dasharray="7 5"/><text x="102" y="895" font-size="11" fill="#605E5C">Management plane (flow 9)</text><text x="40" y="920" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Self-contained shapes, no remote icon dependency.</text></svg>
" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="601" font-size="11" fill="#243A5E">5  CA Policy (session host) evaluated on Cloud Login</text><rect x="560" y="580" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="574" y="601" font-size="11" fill="#243A5E">6  Cloud Login app -> Session Host, RDP token</text><rect x="60" y="620" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="641" font-size="11" fill="#243A5E">7  AVD Feed and Gateway -> Session Host, broker</text><rect x="40" y="705" width="340" height="68" rx="6" fill="#FFFFFF" stroke="#D8DDE3"/><text x="52" y="725" font-size="12" font-weight="700" fill="#243A5E">Legend</text><path d="M52,741 L92,741" stroke="#243A5E" stroke-width="2.4" /><text x="102" y="745" font-size="11" fill="#605E5C">Feed path (flows 1-3, 7)</text><path d="M52,761 L92,761" stroke="#0078D4" stroke-width="2.4" /><text x="102" y="765" font-size="11" fill="#605E5C">Session sign-in path (flows 4-6)</text><text x="40" y="795" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Self-contained shapes, no remote icon dependency.</text></svg>
0" width="1420" height="335" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="322" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="340" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="361" font-size="11" fill="#243A5E">1  Device Object -- member of -- Device Group</text><rect x="60" y="380" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="401" font-size="11" fill="#243A5E">2  Device Group -> Microsoft Intune, policy scope</text><rect x="60" y="420" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="441" font-size="11" fill="#243A5E">3  Microsoft Intune -> MDM Agent, configuration (device-scope and user-scope policies, see Chapter 24)</text><rect x="60" y="460" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="481" font-size="11" fill="#243A5E">4  MDM Agent -> Windows, applies configuration</text><rect x="60" y="500" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="521" font-size="11" fill="#243A5E">5  AVD Service -> AVD Agent, brokering (registration, session assignment - entirely separate from configuration)</text><rect x="60" y="540" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="561" font-size="11" fill="#243A5E">6  AVD Agent -- runs on -- Windows</text><rect x="60" y="580" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#8A7A5C"/><text x="74" y="601" font-size="11" fill="#8A7A5C">7  Group Policy -> Windows, applies (hybrid join only, coexists with Intune per Chapter 24's precedence rules)</text><text x="40" y="660" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Self-contained shapes, no remote icon dependency.</text></svg>
A7A5C" stroke-width="2"/><circle cx="640" cy="375.0" r="6" fill="none" stroke="#8A7A5C" stroke-width="1.7"/><text x="668" y="381" font-size="13" font-weight="600" fill="#243A5E">Domain Controller</text></g><rect x="40" y="480" width="1000" height="215" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="502" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="520" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="541" font-size="11" fill="#243A5E">1  Windows App -> Conditional Access, sign-in on the AVD app</text><rect x="560" y="520" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="574" y="541" font-size="11" fill="#243A5E">2  Conditional Access -> MFA (if required by policy)</text><rect x="60" y="560" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="581" font-size="11" fill="#243A5E">3  Conditional Access -> Azure Virtual Desktop app, authorization</text><rect x="560" y="560" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="574" y="581" font-size="11" fill="#243A5E">4  Azure Virtual Desktop app -> AVD Service, feed request</text><rect x="60" y="600" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="621" font-size="11" fill="#243A5E">5  AVD Service -> Windows App, feed returned</text><rect x="560" y="600" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="574" y="621" font-size="11" fill="#243A5E">6  Windows App -> Windows Cloud Login, second sign-in</text><rect x="60" y="640" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="661" font-size="11" fill="#243A5E">7  Windows Cloud Login -> Session Host, RDP token</text><rect x="560" y="640" width="470" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="574" y="661" font-size="11" fill="#243A5E">8  Session Host -> Domain Controller, Kerberos 88 (hybrid join only)</text><rect x="40" y="725" width="340" height="88" rx="6" fill="#FFFFFF" stroke="#D8DDE3"/><text x="52" y="745" font-size="12" font-weight="700" fill="#243A5E">Legend</text><path d="M52,761 L92,761" stroke="#243A5E" stroke-width="2.4" /><text x="102" y="765" font-size="11" fill="#605E5C">Feed authorization (flows 1-5)</text><path d="M52,781 L92,781" stroke="#0078D4" stroke-width="2.4" /><text x="102" y="785" font-size="11" fill="#605E5C">Session sign-in (flows 6-7)</text><path d="M52,801 L92,801" stroke="#8A7A5C" stroke-width="2.4" /><text x="102" y="805" font-size="11" fill="#605E5C">Hybrid join only (flow 8)</text><text x="40" y="840" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Self-contained shapes, no remote icon dependency.</text></svg>
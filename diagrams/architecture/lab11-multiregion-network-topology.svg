s-01</text><text x="868" y="186" font-size="11" fill="#605E5C">10.20.1.0/24</text></g><g><rect x="1130" y="140" width="300" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="1160" cy="157.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="1150" cy="173.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="1170" cy="173.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M1160,161.0 L1150,169.0 M1160,161.0 L1170,169.0" stroke="#243A5E" stroke-width="1.7"/><text x="1188" y="170" font-size="13" font-weight="600" fill="#243A5E">snet-hosts-lab-cus-01</text><text x="1188" y="186" font-size="11" fill="#605E5C">10.20.2.0/23</text></g><g><rect x="810" y="200" width="300" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="840" cy="217.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="830" cy="233.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="850" cy="233.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M840,221.0 L830,229.0 M840,221.0 L850,229.0" stroke="#243A5E" stroke-width="1.7"/><text x="868" y="230" font-size="13" font-weight="600" fill="#243A5E">snet-storage-lab-cus-01</text><text x="868" y="246" font-size="11" fill="#605E5C">10.20.4.0/24</text></g><g><rect x="1130" y="200" width="300" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="1160" cy="217.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="1150" cy="233.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="1170" cy="233.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M1160,221.0 L1150,229.0 M1160,221.0 L1170,229.0" stroke="#243A5E" stroke-width="1.7"/><text x="1188" y="230" font-size="13" font-weight="600" fill="#243A5E">snet-mgmt-lab-cus-01</text><text x="1188" y="246" font-size="11" fill="#605E5C">10.20.5.0/24</text></g><g><rect x="810" y="265" width="620" height="55" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><rect x="830" y="280.5" width="20" height="24" rx="2" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M835,287.5 h10 M835,292.5 h10 M835,297.5 h6" stroke="#605E5C" stroke-width="1.7"/><text x="868" y="295" font-size="13" font-weight="600" fill="#243A5E">nsg-hosts-lab-cus-01</text><text x="868" y="311" font-size="11" fill="#605E5C">+ nsg-identity, nsg-storage</text></g><path d="M720,180 L780,180" stroke="#107C10" stroke-width="3" fill="none"  marker-end="url(#ag)"/><rect x="695.2" y="148" width="109.6" height="17" rx="3" fill="#FFFFFF" opacity="0.95"/><text x="750" y="160" font-size="11" fill="#107C10" text-anchor="middle">peer-eus2-to-cus</text><path d="M780,235 L720,235" stroke="#107C10" stroke-width="3" fill="none"  marker-end="url(#ag)"/><rect x="695.2" y="243" width="109.6" height="17" rx="3" fill="#FFFFFF" opacity="0.95"/><text x="750" y="255" font-size="11" fill="#107C10" text-anchor="middle">peer-cus-to-eus2</text><rect x="40" y="460" width="1420" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="482" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS AND DESIGN NOTES (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="500" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="521" font-size="11" fill="#243A5E">1  peer-eus2-to-cus and peer-cus-to-eus2: bidirectional VNet peering, not transitive, each direction is its own resource</text><rect x="60" y="540" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="561" font-size="11" fill="#243A5E">2  allow_virtual_network_access = true on both sides; allow_gateway_transit and use_remote_gateways = false (no shared gateway in this lab)</text><rect x="60" y="580" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="601" font-size="11" fill="#243A5E">3  Address spaces do not overlap by design: 10.10.0.0/16 (eastus2) and 10.20.0.0/16 (centralus) - required for peering to succeed</text><rect x="60" y="620" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="641" font-size="11" fill="#B77300">4  DNS resolution across regions is NOT configured in this lab - it depends on the centralus domain controller Lab 12 builds</text><rect x="60" y="660" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="681" font-size="11" fill="#243A5E">5  nsg-identity-lab-cus-01 adds Allow-AD-Replication-From-Eastus2 (source 10.10.0.0/16), a rule Lab 3's original NSG did not need</text><text x="40" y="740" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against terraform/lab11-multiregion-network, August 2026. Self-contained shapes, no remote icon dependency.</text></svg>
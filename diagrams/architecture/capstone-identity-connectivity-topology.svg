<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="arrow-243A5E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#243A5E"/></marker><marker id="arrow-107C10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#107C10"/></marker><marker id="arrow-B77300" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B77300"/></marker><marker id="arrow-605E5C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#605E5C"/></marker><marker id="arrow-0078D4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7FAFD"/></linearGradient></defs>
<rect width="1500" height="860" fill="#FFFFFF"/>
<text x="40" y="42" font-size="21" font-weight="600" fill="#243A5E">Northwind Identity and Connectivity Foundation: architecture at a glance</text>
<text x="40" y="66" font-size="12.5" fill="#605E5C">Capstone Part C | Two regional hubs, four domain controllers, hybrid identity - Bangalore explicitly out of scope for this part</text>
<line x1="40" y1="78" x2="1460" y2="78" stroke="#E1E5EA"/>
<rect x="40" y="100" width="300" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="56" y="126" font-size="13" font-weight="600" fill="#243A5E">Chicago</text><text x="56" y="144" font-size="11" fill="#605E5C">On-premises AD forest, ExpressRoute</text><rect x="1160" y="100" width="300" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="1176" y="126" font-size="13" font-weight="600" fill="#243A5E">Amsterdam</text><text x="1176" y="144" font-size="11" fill="#605E5C">On-premises AD forest, ExpressRoute</text><rect x="600" y="100" width="300" height="55" rx="6" fill="#F7F7F7" stroke="#605E5C" stroke-width="1.6"/><text x="616" y="126" font-size="13" font-weight="600" fill="#605E5C">Bangalore</text><text x="616" y="144" font-size="11" fill="#605E5C">No ExpressRoute - out of scope, Part C sec. 6</text><path d="M190,155 L190,195" stroke="#0078D4" stroke-width="2.4" fill="none" marker-end="url(#arrow-0078D4)"/><rect x="140" y="165" width="100" height="17" rx="3" fill="#FFFFFF" opacity="0.95"/><text x="190" y="177" font-size="10.5" fill="#0078D4" text-anchor="middle">ExpressRoute</text><path d="M1310,155 L1310,195" stroke="#0078D4" stroke-width="2.4" fill="none" marker-end="url(#arrow-0078D4)"/><rect x="1260" y="165" width="100" height="17" rx="3" fill="#FFFFFF" opacity="0.95"/><text x="1310" y="177" font-size="10.5" fill="#0078D4" text-anchor="middle">ExpressRoute</text><rect x="60" y="205" width="660" height="340" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8"/><text x="74" y="227" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">EAST US 2 - serves Chicago</text><rect x="90" y="245" width="600" height="60" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="106" y="271" font-size="13" font-weight="600" fill="#243A5E">Hub VNet - GatewaySubnet, AzureFirewallSubnet</text><text x="106" y="289" font-size="11" fill="#605E5C">ErGwScale gateway, Azure Firewall (AZFW_VNet)</text><rect x="90" y="320" width="600" height="65" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="106" y="346" font-size="13" font-weight="600" fill="#107C10">Identity spoke</text><text x="106" y="364" font-size="11" fill="#605E5C">vm-dc-eus2-01, vm-dc-eus2-02 - joins existing forest</text><rect x="90" y="400" width="600" height="45" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><text x="106" y="426" font-size="13" font-weight="600" fill="#B77300">Entra Connect Sync server</text><text x="106" y="444" font-size="11" fill="#605E5C">ADR-CAP-01: not Cloud Sync - hybrid join still preview</text><text x="90" y="475" font-size="11" fill="#605E5C">DNS: this region's DCs primary, West Europe's secondary</text><rect x="780" y="205" width="660" height="340" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8"/><text x="794" y="227" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">WEST EUROPE - serves Amsterdam</text><rect x="810" y="245" width="600" height="60" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="826" y="271" font-size="13" font-weight="600" fill="#243A5E">Hub VNet - GatewaySubnet, AzureFirewallSubnet</text><text x="826" y="289" font-size="11" fill="#605E5C">ErGwScale gateway, Azure Firewall (AZFW_VNet)</text><rect x="810" y="320" width="600" height="65" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="826" y="346" font-size="13" font-weight="600" fill="#107C10">Identity spoke</text><text x="826" y="364" font-size="11" fill="#605E5C">vm-dc-weu-01, vm-dc-weu-02 - joins existing forest</text><rect x="810" y="400" width="600" height="45" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><text x="826" y="426" font-size="13" font-weight="600" fill="#B77300">Entra Connect Sync server</text><text x="826" y="444" font-size="11" fill="#605E5C">ADR-CAP-01: not Cloud Sync - hybrid join still preview</text><text x="810" y="475" font-size="11" fill="#605E5C">DNS: this region's DCs primary, East US 2's secondary</text><path d="M720,275 L780,275" stroke="#107C10" stroke-width="2.6" fill="none" marker-end="url(#arrow-107C10)"/><path d="M780,300 L720,300" stroke="#107C10" stroke-width="2.6" fill="none" marker-end="url(#arrow-107C10)"/><rect x="695" y="255" width="130" height="17" rx="3" fill="#FFFFFF" opacity="0.95"/><text x="760" y="267" font-size="10.5" fill="#107C10" text-anchor="middle">hub-to-hub peering</text><rect x="695" y="303" width="150" height="17" rx="3" fill="#FFFFFF" opacity="0.95"/><text x="770" y="315" font-size="10.5" fill="#107C10" text-anchor="middle">AD replication + DNS secondary</text><rect x="40" y="565" width="1420" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8"/><text x="54" y="587" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">HOW TO READ THIS IN 60 SECONDS</text><rect x="60" y="605" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.4"/><text x="74" y="626" font-size="10.8" fill="#243A5E">1  Two regional hubs, direct peering - not Virtual WAN. Northwind has two regions; Chapter 12's own cited trigger for Virtual WAN needs more than two.</text><rect x="60" y="645" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300" stroke-width="1.4"/><text x="74" y="666" font-size="10.8" fill="#B77300">2  ADR-CAP-01: Microsoft Entra Connect Sync, not Cloud Sync - Cloud Sync's hybrid-join device sync reached preview in July 2026, no SLA, no support commitment yet.</text><rect x="60" y="685" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#605E5C" stroke-width="1.4"/><text x="74" y="706" font-size="10.8" fill="#605E5C">3  Bangalore has no ExpressRoute and no platform-level presence in this part - Part A scopes its resolution as an AVD Landing Zone decision, made in Part E.</text><rect x="60" y="725" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.4"/><text x="74" y="746" font-size="10.8" fill="#243A5E">4  A DC failure in one region fails over to the other region's DC via hub peering - designed resilience, validated by deliberately breaking ExpressRoute in a test window (Part C sec. 8).</text><rect x="60" y="765" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.4"/><text x="74" y="786" font-size="10.8" fill="#243A5E">5  Azure Firewall is a platform-shared resource here, justified differently from Lab 18's single-lab rejection of it - see Part C section 5 for why the same component gets two different answers.</text><text x="40" y="840" font-size="10.5" fill="#605E5C">Original architecture diagram for this capstone, not Microsoft's. Verified against terraform/capstone-northwind/platform/connectivity and /identity, and Part C, August 2026. Self-contained, no remote icon dependency.</text></svg>
<rect x="40" y="100" width="1420" height="180" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">DATA COLLECTION - OPT IN, NOT AUTOMATIC</text><g><rect x="60" y="140" width="320" height="110" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><rect x="80" y="183.0" width="20" height="24" rx="2" fill="none" stroke="#0078D4" stroke-width="2"/><path d="M85,190.0 h10 M85,195.0 h10 M85,200.0 h6" stroke="#0078D4" stroke-width="1.7"/><text x="118" y="170" font-size="13" font-weight="600" fill="#243A5E">Host Pool Diagnostics</text><text x="118" y="186" font-size="11" fill="#605E5C">Connection, Error, Checkpoint, HostRegistration</text></g><g><rect x="400" y="140" width="320" height="110" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><path d="M417,203.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#0078D4" stroke-width="2"/><text x="458" y="170" font-size="13" font-weight="600" fill="#243A5E">Session Host Perf Counters</text><text x="458" y="186" font-size="11" fill="#605E5C">CPU, memory, disk queue</text></g><g><rect x="740" y="140" width="320" height="110" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><path d="M757,203.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#0078D4" stroke-width="2"/><text x="798" y="170" font-size="13" font-weight="600" fill="#243A5E">Storage Metrics</text><text x="798" y="186" font-size="11" fill="#605E5C">latency, transactions, throttling</text></g><g><rect x="1080" y="140" width="320" height="110" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><path d="M1110,184.0 l11,5 v7 a11,11 0 0 1 -11,10 a11,11 0 0 1 -11,-10 v-7 z" fill="none" stroke="#0078D4" stroke-width="2"/><text x="1138" y="170" font-size="13" font-weight="600" fill="#243A5E">Entra Sign-in Logs</text><text x="1138" y="186" font-size="11" fill="#605E5C">auth + Conditional Access outcome</text></g><path d="M220,250 L220,300" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M560,250 L560,300" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M900,250 L900,300" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M1240,250 L1240,300" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><rect x="40" y="300" width="1420" height="90" rx="8" fill="#FFFFFF" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="322" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">LOG ANALYTICS WORKSPACE</text><g><rect x="600" y="325" width="300" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><path d="M617,358.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="658" y="355" font-size="13" font-weight="600" fill="#243A5E">Central Workspace</text><text x="658" y="371" font-size="11" fill="#605E5C">single source of truth for triage</text></g><rect x="40" y="420" width="1420" height="270" rx="8" fill="#F4FAF4" stroke="#107C10" stroke-width="1.8" /><text x="54" y="442" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">TRIAGE - THE DECOMPOSITION THAT SAVES HOURS</text><g><rect x="60" y="455" width="320" height="70" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><path d="M77,498.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#107C10" stroke-width="2"/><text x="118" y="485" font-size="13" font-weight="600" fill="#243A5E">1. Errors by type</text><text x="118" y="501" font-size="11" fill="#605E5C">WVDErrors, ranked - start here</text></g><g><rect x="400" y="455" width="320" height="70" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><path d="M417,498.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#107C10" stroke-width="2"/><text x="458" y="485" font-size="13" font-weight="600" fill="#243A5E">2. Which hosts</text><text x="458" y="501" font-size="11" fill="#605E5C">distinguishes one-host vs estate-wide</text></g><g><rect x="740" y="455" width="320" height="70" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><path d="M757,498.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#107C10" stroke-width="2"/><text x="798" y="485" font-size="13" font-weight="600" fill="#243A5E">3. Logon duration</text><text x="798" y="501" font-size="11" fill="#605E5C">decompose: profile vs auth vs host</text></g><g><rect x="1080" y="455" width="320" height="70" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><path d="M1097,498.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#107C10" stroke-width="2"/><text x="1138" y="485" font-size="13" font-weight="600" fill="#243A5E">4. Disconnect clustering</text><text x="1138" y="501" font-size="11" fill="#605E5C">one host = fault, spread = network</text></g><g><rect x="60" y="545" width="660" height="70" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><path d="M77,588.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#107C10" stroke-width="2"/><text x="118" y="575" font-size="13" font-weight="600" fill="#243A5E">5. Storage latency during burst</text><text x="118" y="591" font-size="11" fill="#605E5C">confirms/rules out storage as cause</text></g><g><rect x="740" y="545" width="660" height="70" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><path d="M757,588.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#107C10" stroke-width="2"/><text x="798" y="575" font-size="13" font-weight="600" fill="#243A5E">6. Compare working vs failing host/user</text><text x="798" y="591" font-size="11" fill="#605E5C">fastest way to isolate scope</text></g><text x="40" y="715" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. The six-query sequence is the KQL set from Project 02.</text></svg>
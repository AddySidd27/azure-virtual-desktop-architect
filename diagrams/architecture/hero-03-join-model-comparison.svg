<rect width="1500" height="800" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="600" fill="#243A5E">Hybrid join versus Microsoft Entra join for session hosts</text>
<text x="40" y="70" font-size="13" fill="#605E5C">Hero diagram 3 | Related: Chapter 7 | Neither model is universally correct - the requirement decides</text>
<line x1="40" y1="84" x2="1460" y2="84" stroke="#E1E5EA"/>
<rect x="60" y="110" width="660" height="560" rx="8" fill="#FAF8F3" stroke="#8A7A5C" stroke-width="1.8" /><text x="74" y="132" font-size="12.5" font-weight="700" fill="#8A7A5C" letter-spacing="0.5">HYBRID ENTRA JOINED</text><g><rect x="90" y="150" width="600" height="60" rx="6" fill="url(#tile)" stroke="#8A7A5C" stroke-width="1.6"/><rect x="107" y="167.0" width="26" height="26" rx="2" fill="none" stroke="#8A7A5C" stroke-width="2"/><circle cx="120" cy="180.0" r="6" fill="none" stroke="#8A7A5C" stroke-width="1.7"/><text x="148" y="180" font-size="13" font-weight="600" fill="#243A5E">Domain Controllers</text><text x="148" y="196" font-size="11" fill="#605E5C">Required, in every region hosts run</text></g><g><rect x="90" y="225" width="600" height="60" rx="6" fill="url(#tile)" stroke="#8A7A5C" stroke-width="1.6"/><circle cx="120" cy="247.0" r="4" fill="none" stroke="#8A7A5C" stroke-width="2"/><circle cx="110" cy="263.0" r="4" fill="none" stroke="#8A7A5C" stroke-width="2"/><circle cx="130" cy="263.0" r="4" fill="none" stroke="#8A7A5C" stroke-width="2"/><path d="M120,251.0 L110,259.0 M120,251.0 L130,259.0" stroke="#8A7A5C" stroke-width="1.7"/><text x="148" y="255" font-size="13" font-weight="600" fill="#243A5E">AD Sites and Services</text><text x="148" y="271" font-size="11" fill="#605E5C">Azure subnets must be registered</text></g><g><rect x="90" y="300" width="600" height="60" rx="6" fill="url(#tile)" stroke="#8A7A5C" stroke-width="1.6"/><rect x="107" y="320.0" width="26" height="18" rx="2" fill="none" stroke="#8A7A5C" stroke-width="2"/><rect x="114" y="338.0" width="12" height="3" fill="#8A7A5C"/><text x="148" y="330" font-size="13" font-weight="600" fill="#243A5E">Session host sign-in</text><text x="148" y="346" font-size="11" fill="#605E5C">Domain account + Kerberos</text></g><g><rect x="90" y="375" width="600" height="60" rx="6" fill="url(#tile)" stroke="#8A7A5C" stroke-width="1.6"/><ellipse cx="120" cy="398.0" rx="13" ry="4.5" fill="none" stroke="#8A7A5C" stroke-width="2"/><path d="M107,398.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#8A7A5C" stroke-width="2"/><text x="148" y="405" font-size="13" font-weight="600" fill="#243A5E">Profile storage auth</text><text x="148" y="421" font-size="11" fill="#605E5C">AD DS Kerberos or Entra Kerberos, both supported</text></g><g><rect x="90" y="450" width="600" height="60" rx="6" fill="url(#tile)" stroke="#8A7A5C" stroke-width="1.6"/><rect x="110" y="468.0" width="20" height="24" rx="2" fill="none" stroke="#8A7A5C" stroke-width="2"/><path d="M115,475.0 h10 M115,480.0 h10 M115,485.0 h6" stroke="#8A7A5C" stroke-width="1.7"/><text x="148" y="480" font-size="13" font-weight="600" fill="#243A5E">Intune enrolment</text><text x="148" y="496" font-size="11" fill="#605E5C">GPO auto-enrolment, device credentials</text></g><g><rect x="90" y="525" width="600" height="60" rx="6" fill="url(#tile)" stroke="#8A7A5C" stroke-width="1.6"/><text x="148" y="555" font-size="13" font-weight="600" fill="#243A5E">Legacy on-premises apps</text><text x="148" y="571" font-size="11" fill="#605E5C">Full support, Kerberos/NTLM to on-prem resources</text></g><g><rect x="90" y="600" width="600" height="55" rx="6" fill="url(#tile)" stroke="#8A7A5C" stroke-width="1.6"/><path d="M120,615.5 l13,22 h-26 z" fill="none" stroke="#8A7A5C" stroke-width="2"/><path d="M120,623.5 v6 M120,632.5 v1.5" stroke="#8A7A5C" stroke-width="2"/><text x="148" y="630" font-size="13" font-weight="600" fill="#243A5E">Best fit</text><text x="148" y="646" font-size="11" fill="#605E5C">On-premises dependencies exist, or cannot be removed this year</text></g><rect x="760" y="110" width="660" height="560" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="774" y="132" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">MICROSOFT ENTRA JOINED</text><g><rect x="790" y="150" width="600" height="60" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><rect x="807" y="167.0" width="26" height="26" rx="2" fill="none" stroke="#0078D4" stroke-width="2"/><circle cx="820" cy="180.0" r="6" fill="none" stroke="#0078D4" stroke-width="1.7"/><text x="848" y="180" font-size="13" font-weight="600" fill="#243A5E">Domain Controllers</text><text x="848" y="196" font-size="11" fill="#605E5C">None required</text></g><g><rect x="790" y="225" width="600" height="60" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><circle cx="820" cy="247.0" r="4" fill="none" stroke="#0078D4" stroke-width="2"/><circle cx="810" cy="263.0" r="4" fill="none" stroke="#0078D4" stroke-width="2"/><circle cx="830" cy="263.0" r="4" fill="none" stroke="#0078D4" stroke-width="2"/><path d="M820,251.0 L810,259.0 M820,251.0 L830,259.0" stroke="#0078D4" stroke-width="1.7"/><text x="848" y="255" font-size="13" font-weight="600" fill="#243A5E">DNS dependency</text><text x="848" y="271" font-size="11" fill="#605E5C">None for sign-in. Azure-provided DNS is enough</text></g><g><rect x="790" y="300" width="600" height="60" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><rect x="807" y="320.0" width="26" height="18" rx="2" fill="none" stroke="#0078D4" stroke-width="2"/><rect x="814" y="338.0" width="12" height="3" fill="#0078D4"/><text x="848" y="330" font-size="13" font-weight="600" fill="#243A5E">Session host sign-in</text><text x="848" y="346" font-size="11" fill="#605E5C">Azure RBAC role: Virtual Machine User Login</text></g><g><rect x="790" y="375" width="600" height="60" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><ellipse cx="820" cy="398.0" rx="13" ry="4.5" fill="none" stroke="#0078D4" stroke-width="2"/><path d="M807,398.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#0078D4" stroke-width="2"/><text x="848" y="405" font-size="13" font-weight="600" fill="#243A5E">Profile storage auth</text><text x="848" y="421" font-size="11" fill="#605E5C">Entra Kerberos only. Supports hybrid, cloud-only, external identities</text></g><g><rect x="790" y="450" width="600" height="60" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><rect x="810" y="468.0" width="20" height="24" rx="2" fill="none" stroke="#0078D4" stroke-width="2"/><path d="M815,475.0 h10 M815,480.0 h10 M815,485.0 h6" stroke="#0078D4" stroke-width="1.7"/><text x="848" y="480" font-size="13" font-weight="600" fill="#243A5E">Intune enrolment</text><text x="848" y="496" font-size="11" fill="#605E5C">Automatic, part of AVD deployment. No GPO needed</text></g><g><rect x="790" y="525" width="600" height="60" rx="6" fill="url(#tile)" stroke="#A4262C" stroke-width="1.6"/><path d="M820,543.0 l13,22 h-26 z" fill="none" stroke="#A4262C" stroke-width="2"/><path d="M820,551.0 v6 M820,560.0 v1.5" stroke="#A4262C" stroke-width="2"/><text x="848" y="555" font-size="13" font-weight="600" fill="#243A5E">Legacy on-premises apps</text><text x="848" y="571" font-size="11" fill="#605E5C">Not supported directly. No domain Kerberos ticket available</text></g><g><rect x="790" y="600" width="600" height="55" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><circle cx="820" cy="627.5" r="12" fill="none" stroke="#0078D4" stroke-width="2"/><path d="M815,627.5 l4,4 l7,-8" fill="none" stroke="#0078D4" stroke-width="2"/><text x="848" y="630" font-size="13" font-weight="600" fill="#243A5E">Best fit</text><text x="848" y="646" font-size="11" fill="#605E5C">Cloud-native estate, no on-premises Kerberos/NTLM dependency</text></g><text x="710" y="400" font-size="14" font-weight="700" fill="#605E5C" text-anchor="middle">vs</text><rect x="60" y="690" width="340" height="88" rx="6" fill="#FFFFFF" stroke="#D8DDE3"/><text x="72" y="710" font-size="12" font-weight="700" fill="#243A5E">Legend</text><path d="M72,726 L112,726" stroke="#8A7A5C" stroke-width="2.4" /><text x="122" y="730" font-size="11" fill="#605E5C">Hybrid Entra join requires this</text><path d="M72,746 L112,746" stroke="#0078D4" stroke-width="2.4" /><text x="122" y="750" font-size="11" fill="#605E5C">Entra join requires this instead</text><path d="M72,766 L112,766" stroke="#A4262C" stroke-width="2.4" /><text x="122" y="770" font-size="11" fill="#605E5C">Not supported on Entra join</text><text x="60" y="782" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against Chapter 7 and current Microsoft Entra joined VM guidance.</text></svg>
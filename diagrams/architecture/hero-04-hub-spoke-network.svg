#0078D4" letter-spacing="0.5">AZURE FILES - OUTSIDE THE VNET</text><g><rect x="905" y="660" width="640" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="935" cy="678.0" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M922,678.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="963" y="690" font-size="13" font-weight="600" fill="#243A5E">Azure Files</text><text x="963" y="706" font-size="11" fill="#605E5C">reached only via the private endpoint</text></g><g><rect x="880" y="750" width="690" height="45" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><path d="M910,760.5 l13,22 h-26 z" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M910,768.5 v6 M910,777.5 v1.5" stroke="#243A5E" stroke-width="2"/><text x="938" y="786" font-size="13" font-weight="600" fill="#243A5E">3  Session Hosts -> Private Endpoint -> Azure Files, SMB 445</text></g><g><rect x="880" y="805" width="690" height="45" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><path d="M910,815.5 l13,22 h-26 z" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M910,823.5 v6 M910,832.5 v1.5" stroke="#243A5E" stroke-width="2"/><text x="938" y="841" font-size="13" font-weight="600" fill="#243A5E">4  Session Hosts -> DNS Private Resolver | 5  Session Hosts -> AVD Gateway, TCP 443</text></g><path d="M790,550.0 L850,550.0" stroke="#107C10" stroke-width="3" fill="none" marker-start="url(#a)" marker-end="url(#a)"/><rect x="750.0" y="522.0" width="140" height="20" rx="3" fill="#FFFFFF" stroke="#107C10"/><text x="820.0" y="536.0" font-size="11" font-weight="700" fill="#107C10" text-anchor="middle">VNet peering</text><path d="M280,170 L360,170" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><path d="M620,170 L700,170" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><rect x="632.65" y="150.0" width="54.699999999999996" height="17" rx="3" fill="#FFFFFF" opacity="0.95"/><text x="660.0" y="162.0" font-size="11" fill="#243A5E" text-anchor="middle">sign in</text><rect x="40" y="860" width="340" height="108" rx="6" fill="#FFFFFF" stroke="#D8DDE3"/><text x="52" y="880" font-size="12" font-weight="700" fill="#243A5E">Legend</text><path d="M52,896 L92,896" stroke="#243A5E" stroke-width="2.4" /><text x="102" y="900" font-size="11" fill="#605E5C">Numbered flow, see 1-5 above</text><path d="M52,916 L92,916" stroke="#107C10" stroke-width="2.4" /><text x="102" y="920" font-size="11" fill="#605E5C">VNet peering</text><path d="M52,936 L92,936" stroke="#A4262C" stroke-width="2.4" /><text x="102" y="940" font-size="11" fill="#605E5C">Explicitly blocked (NSG)</text><path d="M52,956 L92,956" stroke="#605E5C" stroke-width="2.4" /><text x="102" y="960" font-size="11" fill="#605E5C">UDR association, not a hop</text><text x="40" y="985" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against Chapters 11-13. Self-contained vector icons, no remote image dependency.</text></svg>
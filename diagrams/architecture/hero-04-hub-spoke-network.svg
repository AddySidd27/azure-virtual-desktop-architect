ext x="54" y="292" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">HUB VNET</text><g><rect x="70" y="325" width="330" height="70" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="88" y="348.0" width="24" height="24" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M88,356.0 h24 M88,364.0 h24 M96,348.0 v24 M104,348.0 v24" stroke="#243A5E" stroke-width="1.3"/><text x="128" y="355" font-size="13" font-weight="600" fill="#243A5E">Azure Firewall</text><text x="128" y="371" font-size="11" fill="#605E5C">AVD FQDN tag, egress control</text></g><g><rect x="430" y="325" width="330" height="70" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="460" cy="352.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="450" cy="368.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="470" cy="368.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M460,356.0 L450,364.0 M460,356.0 L470,364.0" stroke="#243A5E" stroke-width="1.7"/><text x="488" y="355" font-size="13" font-weight="600" fill="#243A5E">VPN / ExpressRoute GW</text><text x="488" y="371" font-size="11" fill="#605E5C">on-premises connectivity</text></g><g><rect x="70" y="425" width="330" height="70" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="100" cy="452.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="90" cy="468.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="110" cy="468.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M100,456.0 L90,464.0 M100,456.0 L110,464.0" stroke="#243A5E" stroke-width="1.7"/><text x="128" y="455" font-size="13" font-weight="600" fill="#243A5E">DNS Private Resolver</text><text x="128" y="471" font-size="11" fill="#605E5C">resolves privatelink zones</text></g><g><rect x="430" y="425" width="330" height="70" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><rect x="450" y="448.0" width="20" height="24" rx="2" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M455,455.0 h10 M455,460.0 h10 M455,465.0 h6" stroke="#605E5C" stroke-width="1.7"/><text x="488" y="455" font-size="13" font-weight="600" fill="#243A5E">Route Table: rt-avd-hosts</text><text x="488" y="471" font-size="11" fill="#605E5C">0.0.0.0/0 -> firewall</text></g><g><rect x="70" y="525" width="690" height="70" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="100" cy="552.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="90" cy="568.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="110" cy="568.0" r="4" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M100,556.0 L90,564.0 M100,556.0 L110,564.0" stroke="#243A5E" stroke-width="1.7"/><text x="128" y="555" font-size="13" font-weight="600" fill="#243A5E">Azure Bastion (optional)</text><text x="128" y="571" font-size="11" fill="#605E5C">admin access, no public IP on hosts</text></g><g><rect x="70" y="635" width="690" height="45" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><path d="M100,645.5 l13,22 h-26 z" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M100,653.5 v6 M100,662.5 v1.5" stroke="#243A5E" stroke-width="2"/><text x="128" y="671" font-size="13" font-weight="600" fill="#243A5E">1  Session Hosts -> Firewall -> approved destinations</text></g><g><rect x="70" y="690" width="690" height="45" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><path d="M100,700.5 l13,22 h-26 z" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M100,708.5 v6 M100,717.5 v1.5" stroke="#243A5E" stroke-width="2"/><text x="128" y="726" font-size="13" font-weight="600" fill="#243A5E">2  Session Hosts -> Peering -> VPN/ExpressRoute GW -> on-premises</text></g><rect x="850" y="270" width="750" height="560" rx="8" fill="#F8FBFE" stroke="#1F5B96" stroke-width="1.8" /><text x="864" y="292" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">AVD 
<rect x="40" y="100" width="420" height="150" rx="8" fill="#FAF8F3" stroke="#8A7A5C" stroke-width="1.8" /><text x="54" y="122" font-size="12.5" font-weight="700" fill="#8A7A5C" letter-spacing="0.5">ON-PREMISES - HEAD OFFICE SITE</text><g><rect x="60" y="150" width="380" height="60" rx="6" fill="url(#tile)" stroke="#8A7A5C" stroke-width="1.6"/><rect x="77" y="167.0" width="26" height="26" rx="2" fill="none" stroke="#8A7A5C" stroke-width="2"/><circle cx="90" cy="180.0" r="6" fill="none" stroke="#8A7A5C" stroke-width="1.7"/><text x="118" y="180" font-size="13" font-weight="600" fill="#243A5E">Domain Controllers</text><text x="118" y="196" font-size="11" fill="#605E5C">primary AD site</text></g><rect x="500" y="100" width="960" height="300" rx="8" fill="#F5F9FD" stroke="#0078D4" stroke-width="1.8" /><text x="514" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">CUSTOMER AZURE - SITE: AZURE-UKSOUTH</text><g><rect x="520" y="140" width="280" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="537" y="152.0" width="26" height="26" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="550" cy="165.0" r="6" fill="none" stroke="#243A5E" stroke-width="1.7"/><text x="578" y="176" font-size="13" font-weight="600" fill="#243A5E">Zone 1: Domain Controller</text></g><g><rect x="820" y="140" width="280" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="837" y="152.0" width="26" height="26" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="850" cy="165.0" r="6" fill="none" stroke="#243A5E" stroke-width="1.7"/><text x="878" y="176" font-size="13" font-weight="600" fill="#243A5E">Zone 2: Domain Controller</text></g><g><rect x="1120" y="140" width="280" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="1137" y="152.0" width="26" height="26" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><circle cx="1150" cy="165.0" r="6" fill="none" stroke="#243A5E" stroke-width="1.7"/><text x="1178" y="176" font-size="13" font-weight="600" fill="#243A5E">Zone 3: Domain Controller</text></g><g><rect x="520" y="220" width="880" height="60" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="537" y="240.0" width="26" height="18" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="544" y="258.0" width="12" height="3" fill="#243A5E"/><text x="578" y="256" font-size="13" font-weight="600" fill="#243A5E">Session Hosts</text></g><rect x="40" y="420" width="1420" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="442" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="460" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="481" font-size="11" fill="#243A5E">1  Session Hosts -> Zone 1 DC, Kerberos 88 and DNS (local, primary path)</text><rect x="60" y="500" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="521" font-size="11" fill="#243A5E">2  Session Hosts -> Zone 2 DC, Kerberos 88 (local, load-shared)</text><rect x="60" y="540" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="561" font-size="11" fill="#243A5E">3  Session Hosts -> Zone 3 DC, Kerberos 88 (local, load-shared)</text><rect x="60" y="580" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="601" font-size="11" fill="#243A5E">4  Zone 1/2/3 Azure DCs -- replication -- On-premises Domain Controllers (AD site link)</text><rect x="60" y="620" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#8A7A5C"/><text x="74" y="641" font-size="11" fill="#8A7A5C">5  Session Hosts -> On-premises Domain Controllers, only if all three Azure DCs fail (fallback, not the normal path)</text><text x="40" y="700" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against scenarios/project-04. Self-contained shapes, no remote icon dependency.</text></svg>
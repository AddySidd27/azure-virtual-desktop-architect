<rect width="1500" height="1135" fill="#FFFFFF"/>
<text x="40" y="42" font-size="21" font-weight="600" fill="#243A5E">Northwind AVD Platform: architecture at a glance</text>
<text x="40" y="66" font-size="12.5" fill="#605E5C">Capstone Part F | The first AVD workload resources, built inside the landing zone Part E prepared</text>
<line x1="40" y1="78" x2="1460" y2="78" stroke="#E1E5EA"/>
<rect x="60" y="100" width="660" height="480" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8"/><text x="74" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">EAST US 2 - Chicago (sub-northwind-avd-prod)</text><rect x="90" y="140" width="600" height="62" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="104" y="162" font-size="12.5" font-weight="600" fill="#107C10">hp-task-eus2-01</text><text x="104" y="178" font-size="10.3" fill="#605E5C">Pooled, D2s_v5</text><text x="104" y="191" font-size="10.3" fill="#605E5C">1,400 total (regional split TBD)</text><rect x="90" y="210" width="600" height="62" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="104" y="232" font-size="12.5" font-weight="600" fill="#107C10">hp-know-eus2-01</text><text x="104" y="248" font-size="10.3" fill="#605E5C">Pooled, D2s_v5</text><text x="104" y="261" font-size="10.3" fill="#605E5C">1,200 total (incl. execs)</text><rect x="90" y="280" width="600" height="62" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="104" y="302" font-size="12.5" font-weight="600" fill="#107C10">hp-fin-eus2-01</text><text x="104" y="318" font-size="10.3" fill="#605E5C">Pooled, D4s_v5</text><text x="104" y="331" font-size="10.3" fill="#605E5C">250 total - SOX scope</text><rect x="90" y="350" width="600" height="62" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6" stroke-dasharray="6,4"/><text x="104" y="372" font-size="12.5" font-weight="600" fill="#B77300">hp-cad-eus2-01</text><text x="104" y="388" font-size="10.3" fill="#605E5C">Personal, GPU (VERIFY)</text><text x="104" y="401" font-size="10.3" fill="#605E5C">180 total</text><rect x="90" y="420" width="600" height="62" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="104" y="442" font-size="12.5" font-weight="600" fill="#107C10">hp-dev-eus2-01</text><text x="104" y="458" font-size="10.3" fill="#605E5C">Personal, D8s_v5</text><text x="104" y="471" font-size="10.3" fill="#605E5C">170 total</text><rect x="90" y="490" width="290" height="45" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="104" y="512" font-size="12.5" font-weight="600" fill="#243A5E">ws-northwind-eus2-01</text><text x="104" y="528" font-size="10.3" fill="#605E5C">One workspace, per Ch3's location rule</text><rect x="400" y="490" width="290" height="45" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="414" y="512" font-size="12.5" font-weight="600" fill="#243A5E">stfslogixnwprdeus201</text><text x="414" y="528" font-size="10.3" fill="#605E5C">Premium/ZRS, Private Endpoint</text><rect x="780" y="100" width="660" height="480" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8"/><text x="794" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">WEST EUROPE - Amsterdam + Bangalore (internet path)</text><rect x="810" y="140" width="600" height="62" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="824" y="162" font-size="12.5" font-weight="600" fill="#107C10">hp-task-weu-01</text><text x="824" y="178" font-size="10.3" fill="#605E5C">Pooled, D2s_v5</text><text x="824" y="191" font-size="10.3" fill="#605E5C">1,400 total (regional split TBD)</text><rect x="810" y="210" width="600" height="62" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="824" y="232" font-size="12.5" font-weight="600" fill="#107C10">hp-know-weu-01</text><text x="824" y="248" font-size="10.3" fill="#605E5C">Pooled, D2s_v5</text><text x="824" y="261" font-size="10.3" fill="#605E5C">1,200 total (incl. execs)</text><rect x="810" y="280" width="600" height="62" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="824" y="302" font-size="12.5" font-weight="600" fill="#107C10">hp-fin-weu-01</text><text x="824" y="318" font-size="10.3" fill="#605E5C">Pooled, D4s_v5</text><text x="824" y="331" font-size="10.3" fill="#605E5C">250 total - SOX scope</text><rect x="810" y="350" width="600" height="62" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6" stroke-dasharray="6,4"/><text x="824" y="372" font-size="12.5" font-weight="600" fill="#B77300">hp-cad-weu-01</text><text x="824" y="388" font-size="10.3" fill="#605E5C">Personal, GPU (VERIFY)</text><text x="824" y="401" font-size="10.3" fill="#605E5C">180 total</text><rect x="810" y="420" width="600" height="62" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="824" y="442" font-size="12.5" font-weight="600" fill="#107C10">hp-dev-weu-01</text><text x="824" y="458" font-size="10.3" fill="#605E5C">Personal, D8s_v5</text><text x="824" y="471" font-size="10.3" fill="#605E5C">170 total</text><rect x="810" y="490" width="290" height="45" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="824" y="512" font-size="12.5" font-weight="600" fill="#243A5E">ws-northwind-weu-01</text><text x="824" y="528" font-size="10.3" fill="#605E5C">Distinct workspace, Ch3's rule</text><rect x="1120" y="490" width="290" height="45" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="1134" y="512" font-size="12.5" font-weight="600" fill="#243A5E">stfslogixnwprdweu01</text><text x="1134" y="528" font-size="10.3" fill="#605E5C">Premium/ZRS, Private Endpoint</text><rect x="60" y="605" width="1380" height="130" rx="8" fill="#F3FAF3" stroke="#107C10" stroke-width="1.8"/><text x="74" y="627" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">RBAC: END USER BUILT HERE, FOR THE FIRST TIME</text><rect x="90" y="645" width="660" height="65" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="104" y="667" font-size="12.5" font-weight="600" fill="#107C10">End User role, per persona, per region</text><text x="104" y="683" font-size="10.3" fill="#605E5C">STANDING, deliberately - deferred from Part E because these application groups didn't exist until now</text><rect x="780" y="645" width="660" height="65" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="794" y="667" font-size="12.5" font-weight="600" fill="#107C10">Non-overlapping by region</text><text x="794" y="683" font-size="10.3" fill="#605E5C">Same Entra group discipline Labs 11-20 proved prevents the FSLogix lock-violation failure</text><rect x="60" y="750" width="1380" height="110" rx="8" fill="#F7F7F7" stroke="#605E5C" stroke-width="1.8"/><text x="74" y="772" font-size="12.5" font-weight="700" fill="#605E5C" letter-spacing="0.5">DELIBERATELY NOT BUILT IN THIS PART</text><rect x="90" y="790" width="1320" height="55" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><text x="104" y="812" font-size="12.5" font-weight="600" fill="#605E5C">Autoscaling (Part H), image pipeline (a focused follow-up), HA/DR (Part H), Intune app assignment (disclosed gap)</text><text x="104" y="828" font-size="10.3" fill="#605E5C">None of these are silently assumed done - each is named and pointed at where it actually belongs</text><rect x="40" y="880" width="1420" height="215" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8"/><text x="54" y="902" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">HOW TO READ THIS IN 60 SECONDS</text><rect x="60" y="920" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.4"/><text x="74" y="941" font-size="10.8" fill="#243A5E">1  All 10 host pools use standard host-pool management, per the existing ADR - not Session Host Configuration, re-argued nowhere in this part.</text><rect x="60" y="960" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300" stroke-width="1.4"/><text x="74" y="981" font-size="10.8" fill="#B77300">2  CAD's GPU VM size is a placeholder, not a decision - Chapter 17 is explicit that GPU sizing is a vendor conversation, flagged VERIFY, not guessed confidently.</text><rect x="60" y="1000" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300" stroke-width="1.4"/><text x="74" y="1021" font-size="10.8" fill="#B77300">3  Regional split of the 3,200 total users is an unconfirmed business decision - every host count in this diagram is downstream of that one placeholder number.</text><rect x="60" y="1040" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.4"/><text x="74" y="1061" font-size="10.8" fill="#243A5E">4  Domain join uses a placeholder domain name (northwind.local), deliberately NOT avdlab.local - the two environments stay independent, per the master plan.</text><text x="40" y="1115" font-size="10.5" fill="#605E5C">Original architecture diagram for this capstone, not Microsoft's. Verified against terraform/capstone-northwind/avd-platform and Part F, August 2026. Self-contained, no remote icon dependency.</text></svg>
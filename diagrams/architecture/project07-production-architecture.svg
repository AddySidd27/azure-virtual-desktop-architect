xt x="74" y="741" font-size="11" fill="#243A5E">5  Core Pool / Shift Pool -> Azure Files Premium, SMB 445</text><rect x="60" y="760" width="1500" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="781" font-size="11" fill="#243A5E">6  Core Pool -> ExpressRoute Gateway -> Contact Centre Application (on-premises)</text><rect x="60" y="800" width="1500" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="821" font-size="11" fill="#243A5E">7  Core Pool -> Billing System (on-premises)</text><rect x="60" y="840" width="1500" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="861" font-size="11" fill="#243A5E">8  Core Pool -> Log Analytics, telemetry -> Alerts -> Service Owner</text><text x="40" y="920" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against scenarios/project-07-call-centre-high-density.md. Self-contained shapes, no remote icon dependency.</text></svg>
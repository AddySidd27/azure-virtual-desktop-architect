oped to a resource group or a specific application group, not the subscription. A checkmark here means "this role,"</text><text x="60" y="465" font-size="11" fill="#243A5E">not "this role at any scope." See Chapter 10 for the scoping decision per role.</text><text x="40" y="515" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Self-contained shapes, no remote icon dependency.</text></svg>
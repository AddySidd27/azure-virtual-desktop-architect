<text x="40" y="46" font-size="22" font-weight="600" fill="#243A5E">Golden image lifecycle - build, validate, roll out, roll back</text>
<text x="40" y="70" font-size="13" fill="#605E5C">Hero diagram 6 | Related: Chapter 23 | The gallery version, not the running host, is the unit of change</text>
<line x1="40" y1="84" x2="1580" y2="84" stroke="#E1E5EA"/>
<g><rect x="40" y="180" width="200" height="90" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="70" cy="225.0" r="12" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M65,225.0 l4,4 l7,-8" fill="none" stroke="#243A5E" stroke-width="2"/><text x="98" y="210" font-size="13" font-weight="600" fill="#243A5E">Marketplace image</text><text x="98" y="226" font-size="11" fill="#605E5C">clean source, never registered</text></g><path d="M240,225 L260,225" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><g><rect x="260" y="180" width="200" height="90" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="277" y="215.0" width="26" height="18" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="284" y="233.0" width="12" height="3" fill="#243A5E"/><text x="318" y="210" font-size="13" font-weight="600" fill="#243A5E">Build VM</text><text x="318" y="226" font-size="11" fill="#605E5C">apps, agents, VDI optimised</text></g><path d="M460,225 L480,225" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><g><rect x="480" y="180" width="200" height="90" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="500" y="213.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M505,220.0 h10 M505,225.0 h10 M505,230.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="538" y="210" font-size="13" font-weight="600" fill="#243A5E">Sysprep, capture</text><text x="538" y="226" font-size="11" fill="#605E5C">generalise, no identity</text></g><path d="M680,225 L700,225" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><g><rect x="700" y="180" width="200" height="90" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><ellipse cx="730" cy="218.0" rx="13" ry="4.5" fill="none" stroke="#B77300" stroke-width="2"/><path d="M717,218.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#B77300" stroke-width="2"/><text x="758" y="210" font-size="13" font-weight="600" fill="#243A5E">Gallery version</text><text x="758" y="226" font-size="11" fill="#605E5C">new, excluded from latest</text></g><path d="M900,225 L920,225" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><g><rect x="920" y="180" width="200" height="90" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><rect x="935" y="214.0" width="14" height="10" rx="1.5" fill="none" stroke="#107C10" stroke-width="2"/><rect x="952" y="214.0" width="14" height="10" rx="1.5" fill="none" stroke="#107C10" stroke-width="2"/><rect x="943" y="227.0" width="14" height="10" rx="1.5" fill="none" stroke="#107C10" stroke-width="2"/><text x="978" y="210" font-size="13" font-weight="600" fill="#243A5E">Pilot pool</text><text x="978" y="226" font-size="11" fill="#605E5C">2-3 hosts, user validation</text></g><path d="M1120,225 L1140,225" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><g><rect x="1140" y="180" width="200" height="90" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="1155" y="214.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="1172" y="214.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="1163" y="227.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><text x="1198" y="210" font-size="13" font-weight="600" fill="#243A5E">Promote to latest</text><text x="1198" y="226" font-size="11" fill="#605E5C">full rollout, batched</text></g><path d="M1340,225 L1360,225" stroke="#243A5E" stroke-width="2" fill="none"  marker-end="url(#a)"/><g><rect x="1360" y="180" width="200" height="90" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><ellipse cx="1390" cy="218.0" rx="13" ry="4.5" fill="none" stroke="#605E5C" stroke-width="2"/><path d="M1377,218.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#605E5C" stroke-width="2"/><text x="1418" y="210" font-size="13" font-weight="600" fill="#243A5E">Previous version</text><text x="1418" y="226" font-size="11" fill="#605E5C">kept as rollback path</text></g><path d="M800,270 L800,340 L240,340 L240,270" stroke="#A4262C" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="300" y="345" width="260" height="17" rx="3" fill="#FFFFFF"/><text x="430" y="358" font-size="11" fill="#A4262C" text-anchor="middle">rollback: redeploy from previous version</text><rect x="40" y="400" width="1540" height="140" rx="8" fill="#FDF6F6" stroke="#A4262C" stroke-width="1.8" /><text x="54" y="422" font-size="12.5" font-weight="700" fill="#A4262C" letter-spacing="0.5">WHAT BREAKS THIS CYCLE IF SKIPPED</text><g><rect x="60" y="435" width="350" height="80" rx="6" fill="url(#tile)" stroke="#A4262C" stroke-width="1.6"/><path d="M90,463.0 l13,22 h-26 z" fill="none" stroke="#A4262C" stroke-width="2"/><path d="M90,471.0 v6 M90,480.0 v1.5" stroke="#A4262C" stroke-width="2"/><text x="118" y="465" font-size="13" font-weight="600" fill="#243A5E">Captured from a live host</text><text x="118" y="481" font-size="11" fill="#605E5C">Registered agent + expired token baked in</text></g><g><rect x="430" y="435" width="350" height="80" rx="6" fill="url(#tile)" stroke="#A4262C" stroke-width="1.6"/><path d="M460,463.0 l13,22 h-26 z" fill="none" stroke="#A4262C" stroke-width="2"/><path d="M460,471.0 v6 M460,480.0 v1.5" stroke="#A4262C" stroke-width="2"/><text x="488" y="465" font-size="13" font-weight="600" fill="#243A5E">No pilot before promotion</text><text x="488" y="481" font-size="11" fill="#605E5C">A defect reaches every host at once</text></g><g><rect x="800" y="435" width="350" height="80" rx="6" fill="url(#tile)" stroke="#A4262C" stroke-width="1.6"/><path d="M830,463.0 l13,22 h-26 z" fill="none" stroke="#A4262C" stroke-width="2"/><path d="M830,471.0 v6 M830,480.0 v1.5" stroke="#A4262C" stroke-width="2"/><text x="858" y="465" font-size="13" font-weight="600" fill="#243A5E">No previous version kept</text><text x="858" y="481" font-size="11" fill="#605E5C">No fast rollback when something breaks</text></g><g><rect x="1170" y="435" width="350" height="80" rx="6" fill="url(#tile)" stroke="#A4262C" stroke-width="1.6"/><path d="M1200,463.0 l13,22 h-26 z" fill="none" stroke="#A4262C" stroke-width="2"/><path d="M1200,471.0 v6 M1200,480.0 v1.5" stroke="#A4262C" stroke-width="2"/><text x="1228" y="465" font-size="13" font-weight="600" fill="#243A5E">Driver/version not pinned</text><text x="1228" y="481" font-size="11" fill="#605E5C">Silent drift out of vendor support</text></g><text x="40" y="575" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Related: Project 09 for the vendor-driver-pinning failure mode.</text></svg>
 height="300" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8" /><text x="434" y="122" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">SCALING PLAN</text><g><rect x="440" y="140" width="300" height="55" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><rect x="460" y="155.5" width="20" height="24" rx="2" fill="none" stroke="#0078D4" stroke-width="2"/><path d="M465,162.5 h10 M465,167.5 h10 M465,172.5 h6" stroke="#0078D4" stroke-width="1.7"/><text x="498" y="176" font-size="13" font-weight="600" fill="#243A5E">Ramp-up</text></g><g><rect x="440" y="205" width="300" height="55" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><rect x="460" y="220.5" width="20" height="24" rx="2" fill="none" stroke="#0078D4" stroke-width="2"/><path d="M465,227.5 h10 M465,232.5 h10 M465,237.5 h6" stroke="#0078D4" stroke-width="1.7"/><text x="498" y="241" font-size="13" font-weight="600" fill="#243A5E">Peak</text></g><g><rect x="440" y="270" width="300" height="55" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><rect x="460" y="285.5" width="20" height="24" rx="2" fill="none" stroke="#0078D4" stroke-width="2"/><path d="M465,292.5 h10 M465,297.5 h10 M465,302.5 h6" stroke="#0078D4" stroke-width="1.7"/><text x="498" y="306" font-size="13" font-weight="600" fill="#243A5E">Ramp-down</text></g><g><rect x="440" y="335" width="300" height="55" rx="6" fill="url(#tile)" stroke="#0078D4" stroke-width="1.6"/><rect x="460" y="350.5" width="20" height="24" rx="2" fill="none" stroke="#0078D4" stroke-width="2"/><path d="M465,357.5 h10 M465,362.5 h10 M465,367.5 h6" stroke="#0078D4" stroke-width="1.7"/><text x="498" y="371" font-size="13" font-weight="600" fill="#243A5E">Off-peak</text></g><rect x="800" y="100" width="340" height="300" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="814" y="122" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">HOST POOLS</text><g><rect x="820" y="150" width="300" height="60" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="835" y="169.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="852" y="169.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="843" y="182.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><text x="878" y="180" font-size="13" font-weight="600" fill="#243A5E">Core Pool</text><text x="878" y="196" font-size="11" fill="#605E5C">25 to 30 hosts, always on</text></g><g><rect x="820" y="225" width="300" height="60" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="835" y="244.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="852" y="244.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><rect x="843" y="257.0" width="14" height="10" rx="1.5" fill="none" stroke="#243A5E" stroke-width="2"/><text x="878" y="255" font-size="13" font-weight="600" fill="#243A5E">Shift Pool</text><text x="878" y="271" font-size="11" fill="#605E5C">0 to 120 hosts, scaled to demand</text></g><g><rect x="820" y="300" width="300" height="60" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><rect x="835" y="319.0" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><rect x="852" y="319.0" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><rect x="843" y="332.0" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><text x="878" y="330" font-size="13" font-weight="600" fill="#243A5E">Surge Pool</text><text x="878" y="346" font-size="11" fill="#605E5C">0 to 50 hosts, manual only</text></g><rect x="40" y="440" width="1100" height="295" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="462" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="480" width="1060" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="501" font-size="11" fill="#243A5E">1  Shift 1 (520) and Shift 2 (610) demand -> Ramp-up</text><rect x="60" y="520" width="1060" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="541" font-size="11" fill="#243A5E">2  Shift 3 (180, lowest) demand -> Off-peak directly</text><rect x="60" y="560" width="1060" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="581" font-size="11" fill="#B77300">3  Emergency Surge (300) -> Surge Pool, manual trigger only (not part of the automatic schedule)</text><rect x="60" y="600" width="1060" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="621" font-size="11" fill="#243A5E">4  Ramp-up, Peak, Ramp-down -> Shift Pool (0 to 120 hosts, the pool that actually flexes)</text><rect x="60" y="640" width="1060" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="661" font-size="11" fill="#243A5E">5  Off-peak -> Core Pool (25 to 30 hosts, the floor that never goes to zero)</text><rect x="60" y="680" width="1060" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="701" font-size="11" fill="#243A5E">6  Core Pool and Shift Pool share the same workspace and application groups (users see one desktop, not two pools)</text><text x="40" y="760" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against scenarios/project-07-call-centre-high-density.md. Self-contained shapes, no remote icon dependency.</text></svg>
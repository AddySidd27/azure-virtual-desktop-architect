<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="870" viewBox="0 0 1500 870" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="arrow-243A5E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#243A5E"/></marker><marker id="arrow-107C10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#107C10"/></marker><marker id="arrow-B77300" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B77300"/></marker><marker id="arrow-605E5C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#605E5C"/></marker><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7FAFD"/></linearGradient></defs>
<rect width="1500" height="870" fill="#FFFFFF"/>
<text x="40" y="42" font-size="21" font-weight="600" fill="#243A5E">Northwind Enterprise Azure Landing Zone: architecture at a glance</text>
<text x="40" y="66" font-size="12.5" fill="#605E5C">Capstone Part B | Solid = built in this part | Dashed = named, reserved, not yet built (Part E)</text>
<line x1="40" y1="78" x2="1460" y2="78" stroke="#E1E5EA"/>
<rect x="560" y="100" width="380" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="576" y="126" font-size="13" font-weight="600" fill="#243A5E">Tenant Root -> Northwind (Intermediate Root)</text><text x="576" y="144" font-size="11" fill="#605E5C">One governed hierarchy for the whole enterprise</text><path d="M700,150 L700,180 L280,180 L280,210" stroke="#243A5E" stroke-width="2" fill="none"/><path d="M840,150 L840,180 L1180,180 L1180,210" stroke="#243A5E" stroke-width="2" fill="none"/><rect x="60" y="210" width="660" height="320" rx="8" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.8"/><text x="74" y="232" font-size="12.5" font-weight="700" fill="#0078D4" letter-spacing="0.5">PLATFORM  -  enterprise-wide capabilities (built)</text><rect x="90" y="250" width="190" height="65" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="106" y="276" font-size="13" font-weight="600" fill="#243A5E">Identity</text><text x="106" y="294" font-size="11" fill="#605E5C">sub-northwind-identity</text><rect x="300" y="250" width="190" height="65" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="316" y="276" font-size="13" font-weight="600" fill="#243A5E">Management</text><text x="316" y="294" font-size="11" fill="#605E5C">sub-northwind-management</text><rect x="510" y="250" width="190" height="65" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="526" y="276" font-size="13" font-weight="600" fill="#243A5E">Connectivity</text><text x="526" y="294" font-size="11" fill="#605E5C">sub-northwind-connectivity</text><text x="90" y="342" font-size="11" fill="#605E5C">Hybrid AD + Entra sync</text><text x="300" y="342" font-size="11" fill="#605E5C">Tenant-wide Log Analytics</text><text x="510" y="342" font-size="11" fill="#605E5C">Hub networks, ExpressRoute</text><rect x="90" y="365" width="610" height="55" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="106" y="391" font-size="13" font-weight="600" fill="#107C10">Enterprise-wide governance</text><text x="106" y="409" font-size="11" fill="#605E5C">Azure Policy (tags, regions, diagnostics), PIM/RBAC, FinOps, security baseline</text><rect x="90" y="440" width="300" height="55" rx="6" fill="url(#tile)" stroke="#605E5C" stroke-width="1.6"/><text x="106" y="466" font-size="13" font-weight="600" fill="#605E5C">Decommissioned</text><text x="106" y="484" font-size="11" fill="#605E5C">governance hygiene - Part B, section 4</text><rect x="780" y="210" width="660" height="320" rx="8" fill="#F3FAF3" stroke="#107C10" stroke-width="1.8"/><text x="794" y="232" font-size="12.5" font-weight="700" fill="#107C10" letter-spacing="0.5">LANDING ZONES  -  workload landing zones</text><rect x="810" y="250" width="600" height="55" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><text x="826" y="276" font-size="13" font-weight="600" fill="#107C10">Corp  (built, reserved, empty)</text><text x="826" y="294" font-size="11" fill="#605E5C">Workloads requiring hybrid connectivity land here</text><rect x="810" y="320" width="600" height="95" rx="6" fill="#FDF6EC" stroke="#B77300" stroke-width="1.6" stroke-dasharray="6,4"/><text x="826" y="346" font-size="13" font-weight="600" fill="#B77300">FUTURE: AVD Landing Zone</text><text x="826" y="364" font-size="11" fill="#605E5C">Part E - not yet built - sub-northwind-avd-prod / -nonprod</text><text x="826" y="392" font-size="11" fill="#B77300">Five host pools x two regions, designed in the Master Plan</text><rect x="810" y="440" width="600" height="55" rx="6" fill="#F7F7F7" stroke="#605E5C" stroke-width="1.6"/><text x="826" y="466" font-size="13" font-weight="600" fill="#605E5C">NOT built</text><text x="826" y="484" font-size="11" fill="#605E5C">Online landing zone, Sandbox MG - no stated requirement (section 4)</text><path d="M810,405 L730,405" stroke="#B77300" stroke-width="2.2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow-B77300)"/><rect x="732" y="392" width="150" height="17" rx="3" fill="#FFFFFF" opacity="0.95"/><text x="807" y="404" font-size="10.5" fill="#B77300" text-anchor="middle">consumes, does not own</text><rect x="40" y="575" width="1420" height="255" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8"/><text x="54" y="597" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">HOW TO READ THIS IN 60 SECONDS</text><rect x="60" y="615" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.4"/><text x="74" y="636" font-size="11" fill="#243A5E">1  Platform (Identity, Management, Connectivity) is built now, in this part: three real subscriptions, governed centrally.</text><rect x="60" y="655" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300" stroke-width="1.4"/><text x="74" y="676" font-size="11" fill="#B77300">2  The AVD Landing Zone does not exist yet. It is named, reserved, and dashed on purpose - Part E builds it, consuming this platform, not duplicating it.</text><rect x="60" y="695" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.4"/><text x="74" y="716" font-size="11" fill="#243A5E">3  Every box on this diagram traces to a specific Part A requirement - nothing here is a reference-architecture default with no stated Northwind reason.</text><rect x="60" y="735" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#605E5C" stroke-width="1.4"/><text x="74" y="756" font-size="11" fill="#605E5C">4  Online landing zone and Sandbox management group are deliberately absent - see Part B section 4 for the reasoning, not an oversight.</text><rect x="60" y="775" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E" stroke-width="1.4"/><text x="74" y="796" font-size="11" fill="#243A5E">5  When AVD is built, it will not own its own identity or network - it authenticates against Platform/Identity and rides Platform/Connectivity's hub.</text><text x="40" y="850" font-size="10.5" fill="#605E5C">Original architecture diagram created for this capstone. Not a Microsoft diagram. Verified against terraform/capstone-northwind/platform/ and Part B, August 2026. Self-contained, no remote icon dependency.</text></svg>
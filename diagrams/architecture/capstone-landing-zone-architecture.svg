<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6C8EBF"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#82B366"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D79B00"/></marker>
  </defs>

  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>

  <text x="60" y="24" font-size="19" font-weight="700" fill="#172B4D">Northwind Enterprise Azure Landing Zone: architecture at a glance</text>
  <text x="60" y="47" font-size="12" font-style="italic" fill="#5E6C84">Capstone Part B  |  Solid = built in this part  |  Dashed = named, reserved, not yet built (Part E)</text>

  <!-- Root management group -->
  <image href="https://app.diagrams.net/img/lib/azure2/general/Management_Groups.svg" x="530" y="66" width="60" height="58"/>
  <text x="560" y="140" font-size="12" font-weight="700" text-anchor="middle" fill="#172B4D">Tenant Root -&gt; Northwind</text>
  <text x="560" y="154" font-size="12" font-weight="700" text-anchor="middle" fill="#172B4D">(Intermediate Root)</text>
  <text x="560" y="169" font-size="10" text-anchor="middle" fill="#5E6C84">One governed hierarchy for the whole enterprise</text>

  <!-- Containers -->
  <rect x="60" y="190" width="480" height="420" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <text x="76" y="212" font-size="13" font-weight="700" fill="#1A3A6B">PLATFORM  -  enterprise-wide capabilities (built)</text>

  <rect x="600" y="190" width="460" height="420" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <text x="616" y="212" font-size="13" font-weight="700" fill="#274E13">LANDING ZONES  -  workload landing zones</text>

  <!-- Arrows from root -->
  <path d="M 690,168 L 690,178 L 300,178 L 300,188" fill="none" stroke="#6C8EBF" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M 690,168 L 690,178 L 830,178 L 830,188" fill="none" stroke="#82B366" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Identity -->
  <image href="https://app.diagrams.net/img/lib/azure2/identity/Azure_Active_Directory.svg" x="105" y="248" width="50" height="46"/>
  <text x="130" y="308" font-size="11" font-weight="700" text-anchor="middle" fill="#1A3A6B">Identity</text>
  <text x="130" y="321" font-size="9.5" text-anchor="middle" fill="#5E6C84">sub-northwind-identity</text>

  <!-- Management -->
  <image href="https://app.diagrams.net/img/lib/azure2/management_governance/Log_Analytics_Workspaces.svg" x="235" y="248" width="50" height="46"/>
  <text x="260" y="308" font-size="11" font-weight="700" text-anchor="middle" fill="#1A3A6B">Management</text>
  <text x="260" y="321" font-size="9.5" text-anchor="middle" fill="#5E6C84">sub-northwind-management</text>

  <!-- Connectivity -->
  <image href="https://icons.diagrams.net/assets/azure/1/Express_Route.svg" x="380" y="255" width="42" height="32"/>
  <text x="401" y="308" font-size="11" font-weight="700" text-anchor="middle" fill="#1A3A6B">Connectivity</text>
  <text x="401" y="321" font-size="9.5" text-anchor="middle" fill="#5E6C84">hub networks, ExpressRoute</text>

  <!-- Governance box -->
  <rect x="90" y="350" width="420" height="80" rx="6" fill="#ffffff" stroke="#6C8EBF" stroke-width="1.25"/>
  <text x="106" y="374" font-size="11.5" font-weight="700" fill="#1A3A6B">Enterprise-wide governance</text>
  <text x="106" y="393" font-size="11" fill="#1A3A6B">Azure Policy (tags, regions, diagnostics),</text>
  <text x="106" y="409" font-size="11" fill="#1A3A6B">PIM/RBAC, FinOps, security baseline</text>

  <text x="90" y="452" font-size="10" font-style="italic" fill="#5E6C84">Decommissioned  -  governance hygiene  ·  Part B, section 4</text>

  <!-- Corp LZ -->
  <image href="https://icons.diagrams.net/assets/others/1/Azure_Subscription.svg" x="625" y="248" width="52" height="39"/>
  <text x="651" y="304" font-size="11" font-weight="700" text-anchor="middle" fill="#274E13">Corp (built, reserved, empty)</text>
  <text x="651" y="318" font-size="9.5" text-anchor="middle" fill="#5E6C84">Workloads requiring hybrid</text>
  <text x="651" y="330" font-size="9.5" text-anchor="middle" fill="#5E6C84">connectivity land here</text>

  <!-- AVD Landing Zone (future, dashed) -->
  <rect x="770" y="248" width="270" height="140" rx="6" fill="#FFF4E6" stroke="#D79B00" stroke-width="1.5" stroke-dasharray="6,4"/>
  <image href="https://app.diagrams.net/img/lib/azure2/other/Windows_Virtual_Desktop.svg" x="786" y="266" width="46" height="46"/>
  <text x="786" y="332" font-size="11.5" font-weight="700" fill="#7A4A00">FUTURE: AVD Landing Zone</text>
  <text x="786" y="349" font-size="10" fill="#7A4A00">Part E · not yet built</text>
  <text x="786" y="363" font-size="10" fill="#7A4A00">sub-northwind-avd-prod / nonprod</text>
  <text x="786" y="377" font-size="10" fill="#7A4A00">Five host pools x two regions</text>

  <text x="600" y="418" font-size="10" font-style="italic" fill="#5E6C84">NOT built: Online landing zone, Sandbox MG  -  no stated requirement (section 4)</text>

  <!-- Dashed edge: AVD consumes platform -->
  <path d="M 990,388 L 990,490 L 540,490" fill="none" stroke="#D79B00" stroke-width="1.75" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>
  <rect x="660" y="478" width="180" height="16" fill="#D5E8D4"/>
  <text x="750" y="491" font-size="10" fill="#D79B00" text-anchor="middle">consumes, does not own</text>

  <!-- How to read panel -->
  <rect x="60" y="640" width="1000" height="32" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1"/>
  <text x="74" y="661" font-size="13" font-weight="700" fill="#1A3A6B">HOW TO READ THIS IN 60 SECONDS</text>

  <rect x="60" y="674" width="1000" height="40" fill="#EAF2FB"/>
  <text x="74" y="698" font-size="11" fill="#1A3A6B"><tspan font-weight="700">1.</tspan>  Platform (Identity, Management, Connectivity) is built now, in this part: three real subscriptions, governed centrally.</text>

  <rect x="60" y="716" width="1000" height="40" fill="#FFF4E6"/>
  <text x="74" y="740" font-size="11" fill="#7A4A00"><tspan font-weight="700">2.</tspan>  The AVD Landing Zone does not exist yet. It is named, reserved, and dashed on purpose - Part E builds it, consuming this platform, not duplicating it.</text>

  <rect x="0.5" y="0.5" width="1119" height="799" fill="none" stroke="#E1E4E8" stroke-width="1"/>
</svg>

SLogix Agent -> File Share, SMB 445</text><rect x="60" y="460" width="1160" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="481" font-size="11" fill="#243A5E">4  File Share holds the Profile Container</text><rect x="60" y="500" width="1160" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="521" font-size="11" fill="#243A5E">5  Profile Container -> User Profile, attach (success path)</text><rect x="60" y="540" width="1160" height="32" rx="5" fill="#FFFFFF" stroke="#A4262C"/><text x="74" y="561" font-size="11" fill="#A4262C">6  If attach fails: falls back to a Temporary Profile, silently, unless DeleteLocalProfileWhenVHDShouldApply is set</text><text x="40" y="620" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Self-contained shapes, no remote icon dependency.</text></svg>
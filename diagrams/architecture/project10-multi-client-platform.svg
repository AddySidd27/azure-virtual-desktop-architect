 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="798" y="256" font-size="13" font-weight="600" fill="#243A5E">App Attach Share</text></g><g><rect x="1100" y="220" width="340" height="55" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="1130" cy="240.5" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M1117,240.5 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="1158" y="250" font-size="13" font-weight="600" fill="#243A5E">Profile Shares</text><text x="1158" y="266" font-size="11" fill="#605E5C">per client, isolated</text></g><rect x="40" y="360" width="1420" height="150" rx="8" fill="#FAF8F3" stroke="#8A7A5C" stroke-width="1.8" /><text x="54" y="382" font-size="12.5" font-weight="700" fill="#8A7A5C" letter-spacing="0.5">INSURER SYSTEMS</text><g><rect x="70" y="400" width="440" height="60" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="128" y="436" font-size="13" font-weight="600" fill="#243A5E">Insurer A Systems</text></g><g><rect x="530" y="400" width="440" height="60" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><text x="588" y="436" font-size="13" font-weight="600" fill="#243A5E">Insurer B-F Systems</text></g><g><rect x="990" y="400" width="440" height="60" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><text x="1048" y="436" font-size="13" font-weight="600" fill="#243A5E">Insurer D Systems</text></g><rect x="40" y="540" width="1420" height="335" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="562" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="580" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="601" font-size="11" fill="#243A5E">1  Insurer A / B-F / D Teams -> AVD Service, broker</text><rect x="60" y="620" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="641" font-size="11" fill="#243A5E">2  AVD Service -> Shared Host Pool (Insurer A, B-F) and Insurer D Host Pool (separate, by design)</text><rect x="60" y="660" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="681" font-size="11" fill="#243A5E">3  Shared Host Pool -> App Attach Share, computer account mount (apps attached, not installed)</text><rect x="60" y="700" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="721" font-size="11" fill="#243A5E">4  Shared Host Pool and Insurer D Host Pool -> Profile Shares, SMB (per-client isolation, even on the shared pool)</text><rect x="60" y="740" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="761" font-size="11" fill="#243A5E">5  Shared Host Pool -> Insurer A Systems, segmented per-client network path</text><rect x="60" y="780" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="801" font-size="11" fill="#243A5E">6  Shared Host Pool -> Insurer B-F Systems, same segmentation pattern</text><rect x="60" y="820" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="841" font-size="11" fill="#243A5E">7  Insurer D Host Pool -> Insurer D Systems, entirely separate pool and path</text><text x="40" y="900" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against scenarios/project-10-remoteapp-line-of-business.md. Self-contained shapes, no remote icon dependency.</text></svg>
0" cy="437.5" r="12" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M95,437.5 l4,4 l7,-8" fill="none" stroke="#243A5E" stroke-width="2"/><text x="128" y="451" font-size="13" font-weight="600" fill="#243A5E">Universal Print</text></g><rect x="40" y="540" width="1420" height="415" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="562" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">FLOWS, IN ORDER (NUMBERED, NOT DRAWN AS CROSSING ARROWS)</text><rect x="60" y="580" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="601" font-size="11" fill="#243A5E">1  Entra-joined Session Hosts -> Microsoft Entra ID, sign-in and RBAC</text><rect x="60" y="620" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="641" font-size="11" fill="#243A5E">2  Microsoft Intune -> Entra-joined Session Hosts, policy, apps, certificates</text><rect x="60" y="660" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="681" font-size="11" fill="#243A5E">3  PIM -> Entra-joined Session Hosts, just-in-time admin activation</text><rect x="60" y="700" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="721" font-size="11" fill="#243A5E">4  Entra-joined Session Hosts -> FSLogix Storage, Entra Kerberos, SMB</text><rect x="60" y="740" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="761" font-size="11" fill="#243A5E">5  Entra-joined Session Hosts -> Universal Print and SharePoint</text><rect x="60" y="780" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="801" font-size="11" fill="#B77300">6  Isolated Hybrid Pool -> its own Domain Controllers, domain join and Kerberos (contained to this pool only)</text><rect x="60" y="820" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="841" font-size="11" fill="#B77300">7  Isolated Hybrid Pool -> Scheduling SQL Server, integrated auth (the one remaining reason for hybrid join)</text><rect x="60" y="860" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="881" font-size="11" fill="#243A5E">8  Isolated Hybrid Pool -> FSLogix Storage (same share, both pools)</text><rect x="60" y="900" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="921" font-size="11" fill="#B77300">9  Isolated pool's Domain Controllers -> Microsoft Entra ID, hybrid sync (contained, not estate-wide)</text><text x="40" y="980" font-size="10.5" fill="#605E5C">Original architecture diagram created for this book. Not a Microsoft diagram. Verified against scenarios/project-05-entra-only-cloud-native.md. Self-contained shapes, no remote icon dependency.</text></svg>
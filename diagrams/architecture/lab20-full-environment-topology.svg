#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="570" cy="225.0" r="12" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M565,225.0 l4,4 l7,-8" fill="none" stroke="#243A5E" stroke-width="2"/><text x="598" y="230" font-size="13" font-weight="600" fill="#243A5E">ws-avdlab-lab-cus-01</text><text x="598" y="246" font-size="11" fill="#605E5C">Distinct workspace, Lab 14</text></g><g><rect x="540" y="255" width="420" height="50" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><rect x="557" y="267.0" width="26" height="26" rx="2" fill="none" stroke="#107C10" stroke-width="2"/><circle cx="570" cy="280.0" r="6" fill="none" stroke="#107C10" stroke-width="1.7"/><text x="598" y="285" font-size="13" font-weight="600" fill="#243A5E">vm-avdlab-dc02</text><text x="598" y="301" font-size="11" fill="#605E5C">Domain controller, DNS PRIMARY for DR</text></g><g><rect x="540" y="310" width="420" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><ellipse cx="570" cy="328.0" rx="13" ry="4.5" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M557,328.0 v13 a13,4.5 0 0 0 26,0 v-13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="598" y="340" font-size="13" font-weight="600" fill="#243A5E">stfslogixlabcus01</text><text x="598" y="356" font-size="11" fill="#605E5C">FSLogix storage, Cloud Cache, Lab 13/15</text></g><g><rect x="540" y="365" width="420" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><path d="M557,398.0 l7,-11 l6,7 l5,-9 l8,13" fill="none" stroke="#243A5E" stroke-width="2"/><text x="598" y="395" font-size="13" font-weight="600" fill="#243A5E">log-avd-lab-cus-01</text><text x="598" y="411" font-size="11" fill="#605E5C">Log Analytics, Lab 18</text></g><g><rect x="540" y="420" width="420" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="560" y="433.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M565,440.0 h10 M565,445.0 h10 M565,450.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="598" y="450" font-size="13" font-weight="600" fill="#243A5E">sp-avd-lab-cus-01</text><text x="598" y="466" font-size="11" fill="#605E5C">Scaling plan, Lab 17</text></g><rect x="1000" y="100" width="460" height="420" rx="8" fill="#FDF6EC" stroke="#B77300" stroke-width="1.8" /><text x="1014" y="122" font-size="12.5" font-weight="700" fill="#B77300" letter-spacing="0.5">WESTUS2 - WARM STANDBY, LAB 19</text><g><rect x="1020" y="140" width="420" height="55" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><rect x="1035" y="156.5" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><rect x="1052" y="156.5" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><rect x="1043" y="169.5" width="14" height="10" rx="1.5" fill="none" stroke="#B77300" stroke-width="2"/><text x="1078" y="170" font-size="13" font-weight="600" fill="#243A5E">hp-avd-dr-lab-wus2-01</text><text x="1078" y="186" font-size="11" fill="#605E5C">Standing, host count = 0</text></g><g><rect x="1020" y="200" width="420" height="50" rx="6" fill="url(#tile)" stroke="#B77300" stroke-width="1.6"/><circle cx="1050" cy="225.0" r="12" fill="none" stroke="#B77300" stroke-width="2"/><path d="M1045,225.0 l4,4 l7,-8" fill="none" stroke="#B77300" stroke-width="2"/><text x="1078" y="230" font-size="13" font-weight="600" fill="#243A5E">No dedicated workspace</text><text x="1078" y="246" font-size="11" fill="#605E5C">Shares eastus2's on failover</text></g><g><rect x="1020" y="255" width="420" height="50" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><rect x="1037" y="267.0" width="26" height="26" rx="2" fill="none" stroke="#107C10" stroke-width="2"/><circle cx="1050" cy="280.0" r="6" fill="none" stroke="#107C10" stroke-width="1.7"/><text x="1078" y="285" font-size="13" font-weight="600" fill="#243A5E">No dedicated DC</text><text x="1078" y="301" font-size="11" fill="#605E5C">Peers to centralus's DC (primary) AND eastus2's (secondary)</text></g><g><rect x="1020" y="310" width="420" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><circle cx="1050" cy="335.0" r="12" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M1045,335.0 l4,4 l7,-8" fill="none" stroke="#243A5E" stroke-width="2"/><text x="1078" y="340" font-size="13" font-weight="600" fill="#243A5E">Capacity reservation</text><text x="1078" y="356" font-size="11" fill="#605E5C">OFF by default - bills standing when enabled</text></g><g><rect x="1020" y="365" width="420" height="50" rx="6" fill="url(#tile)" stroke="#107C10" stroke-width="1.6"/><circle cx="1050" cy="382.0" r="4" fill="none" stroke="#107C10" stroke-width="2"/><circle cx="1040" cy="398.0" r="4" fill="none" stroke="#107C10" stroke-width="2"/><circle cx="1060" cy="398.0" r="4" fill="none" stroke="#107C10" stroke-width="2"/><path d="M1050,386.0 L1040,394.0 M1050,386.0 L1060,394.0" stroke="#107C10" stroke-width="1.7"/><text x="1078" y="395" font-size="13" font-weight="600" fill="#243A5E">peer-wus2-to-cus, peer-wus2-to-eus2</text><text x="1078" y="411" font-size="11" fill="#605E5C">BOTH links - corrected, not eastus2-only</text></g><g><rect x="1020" y="420" width="420" height="50" rx="6" fill="url(#tile)" stroke="#243A5E" stroke-width="1.6"/><rect x="1040" y="433.0" width="20" height="24" rx="2" fill="none" stroke="#243A5E" stroke-width="2"/><path d="M1045,440.0 h10 M1045,445.0 h10 M1045,450.0 h6" stroke="#243A5E" stroke-width="1.7"/><text x="1078" y="450" font-size="13" font-weight="600" fill="#243A5E">Lab 16 groups</text><text x="1078" y="466" font-size="11" fill="#605E5C">Non-overlapping, per population per region</text></g><rect x="40" y="560" width="1420" height="335" rx="8" fill="#F7FAFD" stroke="#1F5B96" stroke-width="1.8" /><text x="54" y="582" font-size="12.5" font-weight="700" fill="#1F5B96" letter-spacing="0.5">WHAT THIS ENVIRONMENT DEMONSTRATES, END TO END</text><rect x="60" y="600" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="621" font-size="11" fill="#243A5E">1  Two ACTIVE regions (eastus2, centralus) serving separate user cohorts simultaneously - true active-active, Labs 11-18</text><rect x="60" y="640" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="661" font-size="11" fill="#243A5E">2  One WARM-STANDBY region (westus2) protecting eastus2 specifically - a genuinely different pattern, Lab 19</text><rect x="60" y="680" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#B77300"/><text x="74" y="701" font-size="11" fill="#B77300">3  CORRECTED: westus2 peers to BOTH eastus2 and centralus - DR identity no longer depends solely on the region it protects</text><rect x="60" y="720" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="741" font-size="11" fill="#243A5E">4  Non-overlapping Entra groups (Lab 16) keep every user assigned to exactly one active region at a time</text><rect x="60" y="760" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="781" font-size="11" fill="#243A5E">5  FSLogix Cloud Cache (Lab 15) replicates profiles between the two ACTIVE regions only - westus2 is not part of that replication</text><rect x="60" y="800" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="821" font-size="11" fill="#243A5E">6  Independent monitoring and autoscaling per active region (Labs 17-18) - no shared workspace, no shared scaling plan</text><rect x="60" y="840" width="1380" height="32" rx="5" fill="#FFFFFF" stroke="#243A5E"/><text x="74" y="861" font-size="11" fill="#243A5E">7  Teardown order in Lab 20's own text: 19 and 20 first, then 14-18, then 12-13, then 11 last - matching the dependency graph, not the numbering</text><text x="40" y="920" font-size="10.5" fill="#605E5C">Original architecture diagram for this book, not Microsoft's. Corrected: DR identity no longer depends on the failed region. Verified against terraform/lab11 through lab19, August 2026. Self-contained, no remote icon dependency.</text></svg>